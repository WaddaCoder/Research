<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal Drafting &amp; Research Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D1520;--surface:#101E2E;--surface2:#0C1A28;--accent:#3A7BD5;--accent-dim:#1E3A5A;--gold:#C9A84C;--gold-dim:#4A3D1E;--text:#FFF;--text2:#FFF;--muted:#3A6A8A;--muted2:#2A4A6A;--border:#1A2E42;--radius:12px;--radius-sm:8px;--fs-xs:.65rem;--fs-sm:.75rem;--fs-base:.9rem;--fs-lg:1.05rem;--fs-xl:1.3rem;--fs-2xl:1.6rem}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
body{background:var(--bg);color:var(--text2);font-family:'Inter',sans-serif;font-size:var(--fs-base);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.hidden{display:none!important}
.header{padding:20px 18px 14px;border-bottom:.5px solid var(--border)}
.header-toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:#1A2838;border:1px solid #2A3A4A;color:#C8C8C8;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;flex-shrink:0}
.app-title{font-family:'Cormorant Garamond',serif;font-size:var(--fs-2xl);font-weight:700;line-height:1.1}
.gold-word{color:var(--gold)}
.app-subtitle{font-size:var(--fs-sm);color:#C8C8C8;margin-top:6px;line-height:1.5}
.accent-line{height:2px;width:40px;background:var(--accent);border-radius:2px;margin-top:10px}
.search-wrap{padding:12px 16px 4px}
.search{width:100%;background:var(--surface);border:.5px solid var(--accent-dim);border-radius:var(--radius-sm);padding:10px 14px;color:#fff;font:inherit}
.search::placeholder{color:var(--muted2)}
.arc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 14px 4px}
.arc-card{background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:11px 12px}
.arc-icon{font-size:16px;margin-bottom:4px}
.arc-title{font-family:'Cormorant Garamond',serif;font-size:.85rem;font-weight:600;color:#A8C4DC;margin-bottom:3px}
.arc-body{font-size:var(--fs-xs);color:#C8C8C8;line-height:1.5}
.jump{display:flex;gap:8px;padding:10px 14px 0;position:sticky;top:0;z-index:5;background:var(--bg)}
.jump a{flex:1;text-align:center;font-size:var(--fs-sm);font-weight:700;padding:9px 6px;border-radius:20px;border:1px solid var(--accent-dim);color:#A8C4DC;cursor:pointer}
.jump a.g{border-color:var(--gold-dim);color:var(--gold)}
.section-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;padding:18px 18px 4px;scroll-margin-top:56px}
.section-label.gold{color:var(--gold)}
.section-sub{font-size:var(--fs-xs);color:#C8C8C8;padding:0 18px 8px;line-height:1.5}
.module-card{--c:#3A7BD5;margin:0 14px 10px;background:var(--surface);border:.5px solid var(--accent-dim);border-radius:var(--radius);padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.module-card:active{transform:scale(.98)}
.module-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.module-card.extra{border-style:dashed}
.module-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.module-section-tag{font-size:var(--fs-xs);font-weight:700;padding:3px 9px;border-radius:5px;color:#10141C;background:color-mix(in srgb,var(--c) 55%,#fff)}
.module-chevron{color:var(--muted2);font-size:var(--fs-lg)}
.module-title{font-family:'Cormorant Garamond',serif;font-size:var(--fs-lg);font-weight:700;margin-bottom:3px}
.module-hint{font-size:var(--fs-xs);color:#C8C8C8;line-height:1.5}
.module-match{font-size:var(--fs-xs);color:var(--gold);margin-top:6px}
.module-pill{display:inline-block;margin-top:8px;font-size:var(--fs-xs);font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--gold);color:#1A1408;background:var(--gold)}
.module-pill.pending{background:transparent;color:var(--muted);border-color:var(--muted2)}
.module-pill.extra{background:transparent;color:var(--gold);border-color:var(--gold-dim)}
.no-match{margin:20px 16px;text-align:center;color:var(--muted);font-size:var(--fs-sm)}
.ms-header{padding:16px 18px 14px;border-bottom:.5px solid var(--border)}
.ms-toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ms-home-btn{width:34px;height:34px;border-radius:9px;background:#E8E8E8;color:#0D1520;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.ms-tag{font-size:var(--fs-xs);font-weight:700;color:#1A1408;background:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:3px 9px}
.ms-title{font-family:'Cormorant Garamond',serif;font-size:var(--fs-xl);font-weight:700}
.ms-intro{font-size:var(--fs-sm);color:#E8E8E8;line-height:1.6;padding:12px 18px 14px;border-bottom:.5px solid var(--border)}
.defs-search-wrap{padding:12px 16px;display:flex;gap:8px;align-items:center}
.defs-collapse-all{font-size:var(--fs-xs);color:var(--muted);border:.5px solid var(--accent-dim);border-radius:var(--radius-sm);padding:10px 12px;white-space:nowrap;cursor:pointer}
.rail{margin:6px 14px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:10px;overflow:hidden}
.rail.priority{border-color:var(--gold-dim)}
.rail.expanded{background:#1A2838;border-color:var(--gold)}
.rail-header{padding:12px 14px;display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.rail-code{font-family:'Inter',monospace;font-size:var(--fs-xs);color:var(--muted);flex-shrink:0;width:40px;padding-top:2px}
.rail.expanded .rail-code{color:var(--gold)}
.rail-text{flex:1}
.rail-term{font-family:'Cormorant Garamond',serif;font-size:var(--fs-lg);font-weight:700;margin-bottom:2px}
.rail-star{color:var(--gold);font-size:var(--fs-xs);margin-right:4px}
.rail-sub{font-size:var(--fs-xs);color:#C8C8C8;line-height:1.4}.exam-tag{display:inline-block;margin-top:5px;margin-left:6px;padding:2px 8px;border:.5px solid var(--accent);border-radius:10px;font-size:var(--fs-xs);color:#8DB4EE;letter-spacing:.02em}.ess-tag{display:inline-block;margin-top:5px;padding:2px 8px;border:.5px solid var(--gold);border-radius:10px;font-size:var(--fs-xs);color:var(--gold);letter-spacing:.02em}.feeds-tag{display:inline-block;margin-top:5px;font-size:var(--fs-xs);color:#9AA8BC;font-style:italic}.ess-legend{margin:14px 16px 6px;padding:10px 14px;border:.5px solid var(--border);border-radius:8px;font-size:var(--fs-xs);color:#C8C8C8;line-height:1.5}.ess-legend b{color:var(--gold)}
.rail-chev{color:var(--muted2);font-size:var(--fs-sm);transition:transform .2s;margin-top:3px}
.rail.expanded .rail-chev{color:var(--gold);transform:rotate(90deg)}
.rail-body{border-top:.5px solid var(--accent-dim);display:none;padding-bottom:12px}
.rail.expanded .rail-body{display:block}
.hook{margin:12px 12px 0;background:#1A1608;border:1px solid var(--gold-dim);border-radius:10px;padding:10px 14px;font-size:var(--fs-sm);color:#D8C898;line-height:1.6}
.hook b{color:var(--gold);letter-spacing:1px;font-size:var(--fs-xs);text-transform:uppercase;display:block;margin-bottom:3px}
.pos{margin:10px 12px 0;border-radius:10px;overflow:hidden;border:1px solid var(--accent-dim)}
.pos-h{background:var(--accent);font-size:var(--fs-xs);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px}
.pos-b{background:#F4F0E6;color:#1A1408;padding:14px}
.pos-t{font-size:var(--fs-base);line-height:1.7;margin-bottom:8px}
.pos-t.sub{padding-left:14px}
.pos-t b{color:#1A1408}
.ill-h{font-size:var(--fs-xs);font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8A7A3A;margin:12px 0 6px;border-top:1px dashed #C8BC9C;padding-top:10px}
.ill{font-size:var(--fs-sm);line-height:1.65;color:#3A3020;margin-bottom:6px;font-style:italic}
.plain{background:#E8E2D0;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:var(--fs-sm);line-height:1.65;color:#2A2418}
.plain b.l{display:block;font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;color:#8A7A3A;margin-bottom:3px}
.xrow{margin-top:10px}
.xlink{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;color:#10141C;background:#C9A84C;border-radius:12px;padding:4px 11px;margin:2px 4px 2px 0;cursor:pointer}
.xlink.part2{background:#D4A24C}
.src{font-size:var(--fs-xs);color:#6A5A3A;margin-top:10px}
.cases-bar{margin:10px 12px 0;background:#1A1608;border:1px solid var(--gold-dim);border-radius:18px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cases-bar.open{border-radius:12px 12px 0 0}
.cases-bar-label{font-size:var(--fs-xs);font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
.cases-bar-action{font-size:var(--fs-xs);color:#D8C898}
.cases-body{display:none;background:#1A1608;border:1px solid var(--gold-dim);border-top:none;border-radius:0 0 12px 12px;padding:12px;margin:0 12px}
.cases-body.open{display:block}
.case-sub{border:1px dashed var(--gold-dim);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.case-sub:last-child{margin-bottom:0}
.case-name{font-size:var(--fs-sm);font-weight:700;color:var(--gold);margin-bottom:2px}
.case-cite{font-size:var(--fs-xs);color:#A89868;margin-bottom:6px}
.case-teaser{font-size:var(--fs-sm);color:#D8D0C0;font-style:italic;line-height:1.6}
.case-flag{display:inline-block;margin-top:6px;font-size:var(--fs-xs);color:#8AD0A0;border:1px solid #1A4A2A;border-radius:10px;padding:1px 8px;font-style:normal}
.case-flag.warn{color:#E0A088;border-color:#5A3A2A}
.boundary{margin:14px 14px 4px;background:#1A1608;border:1px solid var(--gold-dim);border-radius:10px;padding:12px 14px;font-size:var(--fs-sm);color:#D8C898;line-height:1.6}
.recall{margin:10px 14px 4px;background:#0D2A1A;border:1px solid #1A4A2A;border-radius:10px;padding:12px 14px;font-size:var(--fs-sm);color:#BFE8CC;line-height:1.6}
.recall b{display:block;font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;color:#4ACA7A;margin-bottom:3px}
.spar-toggle{margin:14px 14px 0;background:var(--surface2);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.spar-label{font-weight:700;font-size:var(--fs-base);margin-bottom:2px}
.spar-state{font-size:var(--fs-xs);color:#C8C8C8}
.switch{width:54px;height:30px;border-radius:16px;background:#2A3A4A;position:relative;flex-shrink:0;transition:background .2s}
.switch.on{background:var(--gold)}
.knob{width:24px;height:24px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s}
.switch.on .knob{left:27px}
.spar{margin:10px 12px 0;border-radius:12px;overflow:hidden;border:1px solid var(--accent-dim)}
.spar-h{background:#2A3550;font-size:var(--fs-xs);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px;display:flex;justify-content:space-between;cursor:pointer;gap:8px}
.spar-h span:last-child{color:#B8C4E0;text-transform:none;letter-spacing:.3px;font-weight:600}
.spar-b{background:#F4F0E6;color:#1A1408;padding:0 14px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
.spar-b.open{padding:4px 14px 14px;max-height:6000px}
.q{padding:14px 0;border-top:1px solid #D8D0BC}
.q:first-child{border-top:none}
.q-l{font-size:var(--fs-xs);font-weight:700;color:#8A7A3A;letter-spacing:1px;margin-bottom:6px}
.q-t{font-size:var(--fs-base);line-height:1.6;margin-bottom:10px}
.q-ta{width:100%;min-height:64px;border:1px solid #C8BC9C;border-radius:8px;background:#E8E2D0;padding:10px 12px;font:inherit;font-size:var(--fs-sm);color:#1A1408;resize:vertical;margin-bottom:10px}
.q-ta::placeholder{color:#8A8068}
.reveal{border:1px solid #8A7A5A;border-radius:8px;text-align:center;padding:10px;font-weight:600;color:#3A4A8A;cursor:pointer;font-size:var(--fs-sm)}
.q-a{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #C8BC9C;font-size:var(--fs-sm);line-height:1.7;color:#3A3020}
.q-a.open{display:block}
.q-a i{color:#6A5A3A}
details.notes{margin:14px 14px 6px;background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:0}
details.notes summary{cursor:pointer;padding:12px 14px;font-size:var(--fs-sm);font-weight:700;color:#A8C4DC;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:'›  ';color:var(--gold)}
details.notes[open] summary::before{content:'⌄  '}
.notes-b{padding:0 14px 14px;font-size:var(--fs-sm);color:#C8C8C8;line-height:1.65}
.notes-b h4{font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:10px 0 4px}
.notes-b li{margin-left:16px;margin-bottom:4px}
.blk-h{font-size:var(--fs-xs);font-weight:700;letter-spacing:.5px;color:#3A4A8A;margin:14px 0 6px;padding-top:10px;border-top:1px dashed #C8BC9C}.blk-h:first-child{margin-top:0;border-top:none;padding-top:0}.navrow{display:flex;justify-content:space-between;gap:8px;padding:14px 14px 4px}.stub{margin:30px 18px;text-align:center;color:#C8C8C8;font-size:var(--fs-sm);line-height:1.7;background:var(--surface);border:1px dashed var(--accent-dim);border-radius:12px;padding:24px 16px}
.stub b{display:block;font-family:'Cormorant Garamond',serif;font-size:var(--fs-lg);color:#fff;margin-bottom:6px}
.font-bar{background:var(--surface2);border-top:1px solid var(--border);padding:10px 0;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:auto}
.font-bar-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.font-size-display{font-family:'Inter',monospace;font-size:11px;color:#DDE3EE;min-width:36px;text-align:center}
.fp-btn{font-weight:700;border:1px solid var(--border);background:none;color:var(--muted);border-radius:4px;cursor:pointer;padding:5px 13px;font-size:16px}
.fp-btn:active{background:var(--gold);color:#1a1408;border-color:var(--gold)}
@media (min-width:1024px) and (orientation:landscape){.app{max-width:1280px;padding:0 24px}body{font-size:16px}.module-title{font-size:19px}.rail-term{font-size:19px}.ms-title{font-size:24px}.pos-t,.q-t{font-size:16px}.q-a,.ill,.plain{font-size:14px}}
.eq{margin:10px 14px 0;background:#10202F;border:1px solid var(--accent-dim);border-radius:10px;padding:11px 13px;font-size:var(--fs-sm);color:#E8E8E8;line-height:1.55}
.eq b{color:var(--gold)}
.eq .f{font-family:'Cormorant Garamond',serif;font-size:var(--fs-base);color:#fff;font-weight:700;margin-top:4px}
.eff-tag{display:inline-block;margin-top:5px;margin-right:6px;font-size:var(--fs-xs);color:#9ED0B0;border:.5px solid #1A4A2A;border-radius:10px;padding:2px 8px}
.boundary{overflow-x:auto}
.btbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:var(--fs-xs)}
.btbl th,.btbl td{border:1px solid var(--gold-dim);padding:6px 8px;text-align:left;vertical-align:top;line-height:1.45}
.btbl th{background:#2A2210;color:var(--gold);font-weight:700}
.recall{overflow-wrap:anywhere}
.gate{margin:12px 14px 0;border-radius:12px;overflow:hidden;border:1px solid var(--accent-dim)}
.gate-h{background:var(--accent);font-size:var(--fs-xs);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px;display:flex;justify-content:space-between}
.gate-b{background:#0C1A28;padding:10px 12px 14px}
.gstep{display:flex;gap:10px;padding:10px 0;border-top:1px dashed #1A2E42}
.gstep:first-child{border-top:none}
.gnum{width:24px;height:24px;border-radius:50%;background:#1A2838;color:#A8C4DC;font-size:var(--fs-xs);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.gbtns{display:flex;gap:8px;margin-top:10px}

.art{padding:10px 0;border-top:1px dashed #C8BC9C}
.art:first-child{border-top:none;padding-top:0}
.art-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.art-no{font-weight:700;color:#1A1408;font-size:var(--fs-sm)}
.art-per{font-size:var(--fs-xs);font-weight:700;color:#1A1408;background:#C9A84C;border-radius:10px;padding:1px 9px}
.art-d{font-size:var(--fs-sm);line-height:1.6;color:#1A1408}
.art-f{font-size:var(--fs-xs);color:#5A4A2A;margin-top:3px;line-height:1.5}
.art-note{font-size:var(--fs-xs);color:#8A3A2A;margin-top:3px;font-style:italic}
.spar-toggle.global{margin-top:12px}
.gap{margin-top:10px;background:#2A1A0A;border:1px solid #6A3A12;border-radius:8px;padding:8px 11px;font-size:var(--fs-xs);color:#F0C890;line-height:1.55}
.gap b{display:block;font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;color:#E8964A;margin-bottom:2px}
.wc{margin-top:10px;display:grid;gap:6px}
.wc div{border-radius:8px;padding:8px 11px;font-size:var(--fs-sm);line-height:1.55}
.wc .w{background:#2A1010;border:1px solid #6A2020;color:#F0B8B8}
.wc .r{background:#0D2A1A;border:1px solid #1A4A2A;color:#BFE8CC}
.wc b{display:block;font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 14px 0}
.strip span{font-size:var(--fs-xs);font-weight:700;padding:5px 10px;border-radius:14px;border:1px solid var(--accent);color:#8DB4EE;background:#0C1A28}
.strip i{font-style:normal;color:var(--gold);font-weight:700}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid #2A2210;border-radius:8px;margin-bottom:6px;background:#1A1608;cursor:pointer}
.ck .bx{flex:0 0 22px;height:22px;border:1.5px solid var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#1A1408;font-weight:700;font-size:var(--fs-sm)}
.ck.on .bx{background:var(--gold)}
.ck .t{font-size:var(--fs-sm);color:#E8E0C8;line-height:1.5}
.ck.on .t{opacity:.65}
.ckmeta{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:#B8A878;margin-top:6px}
.ckmeta span{cursor:pointer;text-decoration:underline}
.soon{margin:14px 14px 0;border:1px dashed var(--gold-dim);border-radius:12px;padding:14px;color:#D8C898;font-size:var(--fs-sm);line-height:1.6;background:#14110A}
.soon b{color:var(--gold);display:block;font-family:'Cormorant Garamond',serif;font-size:var(--fs-lg,1.25rem);margin-bottom:3px}
.ftag{display:inline-block;margin-top:5px;margin-right:6px;font-size:var(--fs-xs);color:#E8C98A;border:.5px solid #6A5214;border-radius:10px;padding:2px 8px}
.btbl td.ok{color:#9ED0B0}.btbl td.no{color:#F0B8B8}
.hook b{display:inline;letter-spacing:0;text-transform:none;font-size:inherit;margin:0}
.hook b.hl{display:block;letter-spacing:1px;text-transform:uppercase;font-size:var(--fs-xs);margin-bottom:3px}
.recall b{display:inline;letter-spacing:0;text-transform:none;font-size:inherit;margin:0;color:#7AE0A0}
.recall b.hl{display:block;letter-spacing:1px;text-transform:uppercase;font-size:var(--fs-xs);margin-bottom:3px;color:#4ACA7A}

</style>

var CFG={"key": "ldn_v1", "title": "Legal Drafting &amp; Research <span class=\"gold-word\">Navigator</span>", "subtitle": "A ready reference for the skill course: how to find, read and use the law, built from class notes and checked against the Constitution&rsquo;s bare text.", "searchPh": "Search sections, Articles, keywords\u2026", "eq": {"t": "The Sound-Position Equation", "f": "A sound legal position = the right question + the right source, in order + the statute read properly + an authority that binds + the right forum", "n": "Question: Module 1. Source order: 2. Reading a statute: 3. Forum: 4. Precedent and what binds: 5&ndash;6. Before you cite: 7. Meaning and which law wins: 8."}, "legend": "<b>&#9670; Practice priority</b> = my own judgement of what you will use most in day-to-day work; not from your instructor. <b>&#9733; Core rule</b> = a pillar of the method: the four questions, the source order, the structure of a statute, what binds. Orange boxes mark what was not settled in class.", "arcs": [{"id": 1, "l": "Arc 1 &middot; Read the Law", "cls": "", "sub": "Eight modules &middot; from the first question to the last check before you cite", "icon": "&#9878;", "title": "Read the Law", "body": "Modules 1 to 8. Four decision gates, a Forum Finder and two tick-box checks.", "j": "Arc 1 &middot; Read the Law &middot; 8"}, {"id": 2, "l": "Arc 2 &middot; Draft", "cls": "gold", "sub": "Opens when drafting is taught in class", "icon": "&#9998;", "title": "Draft", "body": "Held back until the course teaches drafting.", "j": "Arc 2 &middot; Draft", "soonTitle": "Arc 2 is not built yet", "soon": "Nothing here is guessed. Once the teacher covers drafting, the specimens, clauses and drafting checks go in this arc, using the same rails and gates as Arc 1."}]};
var MODS=[{"n": 1, "p": 1, "c": "#8B7BDF", "s": "Inquiry", "t": "The inquiry and classification", "h": "Four questions to ask first; three pairs to sort any law"}, {"n": 2, "p": 1, "c": "#3A7BD5", "s": "Sources", "t": "Sources of law, in order", "h": "Statute, rules, precedent, doctrine; where the Constitution sits"}, {"n": 3, "p": 1, "c": "#5AAFB0", "s": "Statutes", "t": "Reading a statute", "h": "Structure, preamble, definitions, headings, pari materia (gate and checklist)"}, {"n": 4, "p": 1, "c": "#C9856A", "s": "Forum", "t": "Jurisdiction and the court structure", "h": "Art. 175(2), the tree of courts, Art. 199, tribunals (gate and Forum Finder)"}, {"n": 5, "p": 1, "c": "#B05A6A", "s": "Precedent", "t": "Precedent and judgments", "h": "Ratio and obiter, Arts 189 and 201, vertical and horizontal, in rem"}, {"n": 6, "p": 1, "c": "#5A9A6A", "s": "Exceptions", "t": "When a precedent does not bind", "h": "Conflicting decisions, per incuriam, sub silentio (does it bind me? gate)"}, {"n": 7, "p": 1, "c": "#9A8A4A", "s": "Cite", "t": "Before you cite", "h": "Source, level, currency and the unread-gap rule (checklist)"}, {"n": 8, "p": 1, "c": "#C47FB0", "s": "Meaning", "t": "Meaning, overrides and operative words", "h": "No definition, pari materia, notwithstanding, shall and may (gate)"}];
var MD={"1": {"intro": "Before you open any book, decide what you are asking. Class gave <b>four questions</b> to ask first and <b>three pairs</b> for sorting any law. This module is the front door: every later module answers one of these four questions in detail.", "rails": [{"code": "1.1", "term": "What legal research is", "sub": "Acquisition, then deciphering the law", "hook": "Research is a two-step dance: first you <b>find</b> the music, then you <b>read</b> it. Finding without reading is a library card; reading without finding is guessing.", "plain": "Class noted that legal research is finding the authorities that bear on a question of law, with Black&rsquo;s Law Dictionary written beside it. It has <b>two parts</b>: <b>Acquisition</b> (finding the authorities) and <b>Decipher</b> (working out what the law means).<br><br>Black&rsquo;s defines legal research as finding and assembling authorities that bear on a question of law (as quoted in a law-library guide).", "gap": "The teacher&rsquo;s sentence in the notes is garbled; the Black&rsquo;s wording above was checked separately. A case boxed on the page (read as &ldquo;Azka Valhal v FoP&rdquo;) is unreadable and has no citation, so it is not used here. The notes also show &ldquo;Research &rarr; Trial [?]&rdquo;; the second word is unclear and the teacher&rsquo;s point is missing.", "links": []}, {"code": "1.2", "term": "The first legal question", "sub": "What is the law, and in which forum?", "hook": "Every matter begins with a question about <b>rights and duties</b>. A contract is the simplest example: who owes what to whom.", "plain": "&ldquo;What is the law?&rdquo; splits in two: <b>what</b> law, and <b>which forum</b> it applies in. Then comes the State: it sets the <b>rights and duties</b>. So the <b>first legal question</b> is what rights and duties exist (class example: a contract).", "links": [{"l": "The four-question inquiry", "m": 1, "sec": "1.3"}]}, {"code": "1.3", "term": "The four-question inquiry", "sub": "Rights and duties, type of law, procedure, jurisdiction", "ess": "the method", "prio": 1, "hook": "Four questions before any book is opened: <b>What is owed? Under which law? By what steps? In which court?</b>", "plain": "<b>&#9312; Rights and duties</b>: what is being created or claimed?<br><b>&#9313; Type of law</b>: which law applies? Sort it with the three pairs (next section).<br><b>&#9314; Procedure</b>: what type of procedure?<br><b>&#9315; Jurisdiction</b>: which court or forum?<br><br>Where each one is answered: &#9312; and &#9313; here and in Module 2 (sources); &#9314; in Module 3 (the statute itself); &#9315; in Module 4.", "gap": "A small word above the box reads like &ldquo;Substantive&rdquo; and it is unclear which of the four it labels.", "links": [{"l": "Three pairs for sorting any law", "m": 1, "sec": "1.4"}, {"l": "Act of Parliament", "m": 2, "sec": "2.1"}, {"l": "Jurisdiction comes from law", "m": 4, "sec": "175(2)"}]}, {"code": "1.4", "term": "Three pairs for sorting any law", "sub": "Civil or criminal; general or special; substantive or procedural", "ess": "the method", "prio": 1, "hook": "Three switches, each on or off: <b>who is the wrong against</b> (civil/criminal), <b>how wide is the Act</b> (general/special), <b>what does it do</b> (create rights / enforce them).", "plain": "The teacher wrote three pairs: <b>Civil / Criminal</b>, <b>General / Special</b>, <b>Substantive / Procedural</b>.<br><br>Standard meanings (not written in the notes): civil law deals with private rights between persons; criminal law with offences the State punishes; a general law covers a broad field and a special law a narrow one; substantive law creates rights, duties and offences, procedural law says how they are enforced.", "links": [{"l": "1.5", "m": 1, "sec": "1.5"}]}, {"code": "1.5", "term": "Worked pair: bail under a special and a general law", "sub": "ATA 21-D and 21-E against CrPC s.497", "tag": "General v special", "hook": "Same question, two rulebooks: the Anti-Terrorism Act has its own bail and remand rules, the Code of Criminal Procedure has the general ones.", "src": {"h": "As noted in class, with the statutory points checked", "paras": [{"t": "Anti-Terrorism Act 1997 (special law): s.21-D is headed Bail; s.21-E is headed Remand.", "l": 0}, {"t": "s.21-E(1): the investigating officer applies for police custody remand of not less than 15 and not more than 30 days at one time; the proviso caps the total remand at 90 days.", "l": 1}, {"t": "Section 497 CrPC (general law): when bail may be taken in a non-bailable offence. Third proviso, statutory delay: for an offence not punishable with death, continuous detention for more than one year with the trial not concluded gives a right to bail; a woman gets six months.", "l": 0}, {"t": "Refusal ground: the delay was caused by the accused\u2019s own act or omission. The fourth proviso carves exceptions out of the third.", "l": 1}, {"t": "The teacher\u2019s table: female, life maximum, 6 months; female, death maximum, 1 year; male, double the female period.", "l": 0}], "f": "ATA text: cyrilla.org and Pakistani High Court quotations; CrPC proviso as quoted in High Court judgments. Bare-act text of s.497 not seen."}, "gap": "The death-punishable figures (female one year, male double) and the 14-day remand written at the foot of the page were not checked against the bare act. The Fatal Accidents Act is boxed on the page but the notes do not say why. Section 167 CrPC (headed &ldquo;Procedure when investigation cannot be completed in twenty-four hours&rdquo;) was seen only in a contents list and not read.", "plain": "Same bail question, two procedures. Which one applies depends on which law governs the offence. That is why classification comes before procedure.", "links": []}], "spar": [{"q": "A client says &ldquo;my landlord cheated me&rdquo;. Which of the four questions do you answer first, and what must you still find out before the others?", "a": "&#9312;, rights and duties: what was owed, and by which document or law. You still need the facts and the document (a lease or contract) before you can choose the law (&#9313;), the steps (&#9314;) and the forum (&#9315;)."}, {"q": "An offence is charged under the Anti-Terrorism Act. Which bail and remand rules do you open first, and why not only the CrPC?", "a": "The ATA: s.21-D (bail) and s.21-E (remand, with the 90-day cap). It is the special law for that offence, so it is read first; the CrPC is the general law that fills what the Act leaves open. Say that the special-first rule is the standard principle, and that class showed only the two bail procedures side by side."}, {"q": "Why does it matter whether a rule is substantive or procedural?", "a": "It tells you which text to read and what question it answers: substantive law says what right, duty or offence exists; procedural law says how it is enforced. Mixing them up sends you to the wrong Act, for example to the CPC for a question about what the right is."}], "boundary": "<b>Boundary map &middot; the three pairs, all eight cells</b><br>Three yes/no switches give eight combinations. Every cell, with a standard example of mine (not from class):<table class=\"btbl\"><tr><th>Civil / criminal</th><th>General / special</th><th>Substantive</th><th>Procedural</th></tr><tr><td>Civil</td><td>General</td><td>Contract Act</td><td>Code of Civil Procedure</td></tr><tr><td>Civil</td><td>Special</td><td>Consumer Protection Act (class example)</td><td>Special Acts usually carry their own forum and steps (Family Courts Act has a Jurisdiction heading)</td></tr><tr><td>Criminal</td><td>General</td><td>Pakistan Penal Code</td><td>CrPC (s.497 bail)</td></tr><tr><td>Criminal</td><td>Special</td><td>ATA 1997 creates offences</td><td>ATA 21-D bail, 21-E remand</td></tr></table>Special Acts often mix both columns in one text, so a single Act can sit in two cells. Always check which part of the Act you are reading.", "recall": "<b class=\"hl\">Recall</b>Four questions: <b>owed, law, steps, court</b>. Three pairs: <b>civil/criminal, general/special, substantive/procedural</b>. Special law is read before general; the general Code fills the gaps.", "gate": {"title": "Gate \u00b7 classify the matter", "start": "s1", "steps": {"s1": {"q": "Is the wrong one the State prosecutes (an offence), rather than a private claim between persons?", "law": "Pair 1 in class: civil v criminal.", "hint": "Yes for theft, breach of trust, terrorism. No for a contract dispute, a family claim, a consumer complaint.", "yes": "s2", "no": "s3"}, "s2": {"q": "Does a special Act cover this offence (for example the Anti-Terrorism Act 1997)?", "law": "Pair 2 in class: general v special. Bail and remand were the worked example.", "hint": "If a special Act has its own procedure, it is read first.", "yes": {"end": "Criminal, special law. Read the special Act first (for the ATA: s.21-D bail, s.21-E remand), then the general CrPC for what the Act leaves open. The \"special first\" rule is the standard principle; class only showed the two bail procedures side by side.", "tone": "ok"}, "no": {"end": "Criminal, general law. Substance: the Pakistan Penal Code. Procedure: the Code of Criminal Procedure (for example s.497 on bail).", "tone": "ok"}}, "s3": {"q": "Does a special Act cover this civil matter (for example the Family Courts Act 1964 or the Consumer Protection Act)?", "law": "Pair 2 again: general v special.", "hint": "Family and consumer disputes have their own Acts and forums.", "yes": {"end": "Civil, special law. Read the special Act first, including its own heading for jurisdiction; the general procedure (CPC) fills what it leaves open.", "tone": "ok"}, "no": {"end": "Civil, general law. Substance: the Act on that subject (for example the Contract Act). Procedure: the Code of Civil Procedure.", "tone": "ok"}}}}}, "2": {"intro": "When a question arrives, the sources of law are searched in a set order. Class listed them as <b>statute, rules, precedents, doctrines</b>; the hub records the teacher&rsquo;s order as statute, delegated legislation, <b>Constitution</b>, precedents, doctrines. Where exactly the Constitution sits was not settled in the notes, so it is flagged below.", "rails": [{"code": "2.1", "term": "Act of Parliament", "sub": "The first source: statute law", "ess": "the source order", "prio": 1, "tag": "Source 1", "hook": "The statute is the front door. Precedent explains it, rules fill it in, doctrine covers what it leaves bare.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 175 (Establishment and jurisdiction of courts)", "paras": [{"t": "(2) No court shall have any jurisdiction save as is or may be conferred on it by the Constitution or by or under any law.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "Class example: the <b>Consumer Protection Act</b>. An Act is read first; how to read it is Module 3. Even a court&rsquo;s jurisdiction comes from the Constitution or from a law (Art. 175(2) above), which is why you start with the text, not with a case.", "links": [{"l": "Why read the statute itself", "m": 3, "sec": "3.1"}, {"l": "Jurisdiction comes from law", "m": 4, "sec": "175(2)"}]}, {"code": "2.2", "term": "Rules, regulations, SROs", "sub": "Delegated legislation, read after the Act it serves", "tag": "Source 2", "hook": "Rules are the Act&rsquo;s staff: they work only inside the job the Act gave them.", "plain": "The teacher listed <b>rules, regulations and SROs</b> second. Standard principle (not written in the notes): they are made under power given by an Act, so read the parent Act first and check that the rule stays within it.", "links": []}, {"code": "2.3", "term": "The Constitution", "sub": "Where it sits in the order is not settled in the notes", "tag": "Placement open", "hook": "The Constitution is not a rival to the statute; it is the ground the whole stack stands on. The open question is only where to <i>look</i> for it in your search order.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 189 (Decisions of Federal Constitutional Court and Supreme Court binding on other Courts)", "paras": [{"t": "(1) Any decision of the Federal Constitutional Court shall, to the extent that it decides a question of law or is based upon or enunciates a principle of law, be binding on all other courts in Pakistan including the Supreme Court.", "l": 0}, {"t": "(2) Any decision of the Supreme Court shall, to the extent that it decides a question of law or is based upon or enunciates a principle of law, be binding on all other courts in Pakistan except the Federal Constitutional Court.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "The handwritten list has no separate Constitution line, while the hub records the teacher&rsquo;s order with the Constitution third. In practice the Constitution already appears in later modules: it sets the courts (Module 4) and makes decisions binding (Arts 189 and 201, Module 5).", "gap": "Whether the Constitution sits under item 1 (&ldquo;Act of Parliament&rdquo;) or as its own source after delegated legislation is not confirmed. Ask the teacher or check the handout.", "links": [{"l": "189", "m": 5, "sec": "189"}, {"l": "Art. 201: High Court decisions", "m": 5, "sec": "201"}, {"l": "Jurisdiction comes from law", "m": 4, "sec": "175(2)"}]}, {"code": "2.4", "term": "Precedents", "sub": "Decisions of courts as a source", "tag": "Source 3", "hook": "A precedent is yesterday&rsquo;s judgment working for today&rsquo;s client.", "plain": "Precedent is third in the handwritten list. What binds, what only persuades and when a precedent falls away takes three modules: 5 and 6 here, and the pre-cite checks in 7.", "links": [{"l": "What a precedent is", "m": 5, "sec": "5.1"}, {"l": "189", "m": 5, "sec": "189"}, {"l": "The three exceptions", "m": 6, "sec": "6.1"}]}, {"code": "2.5", "term": "Doctrines", "sub": "Natural justice as the example", "tag": "Source 4", "hook": "Natural justice has no visa and no border: it travels with the case into every courtroom.", "plain": "Class example: <b>natural justice</b>. Three points written beside it: <b>universal</b> (jurisdiction does not matter), <b>horizontal</b> (does not matter) and <b>civil or criminal</b> (does not matter). A doctrine is a principle courts apply across the board, rather than one tied to a single statute. The hub records the teacher stressing doctrines as the most powerful source, and Shah links this to Jurisprudence Units V and VI (sources of law).", "gap": "&ldquo;Horizontal does not matter&rdquo; is written without an explanation. It may mean it applies at every level of court, but that is a guess.", "links": []}], "spar": [{"q": "A client asks if a department can do X. You find an SRO that allows it and a statute that is silent. Which do you trust and what do you check?", "a": "Check the parent Act first: does it give power to make rules on this subject? The SRO works only inside that power. If the Act is silent on the subject and gives no rule-making power for it, the SRO is open to challenge. The principle is standard, not from class notes."}, {"q": "Why can a court not simply decide any dispute it likes? Which source answers it?", "a": "Art. 175(2) of the Constitution: no court has jurisdiction except what the Constitution or a law confers on it. That is a statute-and-Constitution point, before any case law."}, {"q": "Name the three things class said natural justice does not depend on.", "a": "Jurisdiction (universal), horizontal (the notes do not explain it) and civil v criminal. Mention that the middle one is unexplained in the notes."}], "recall": "<b class=\"hl\">Recall</b>Search order from class: <b>statute &rarr; rules, regulations, SROs &rarr; precedents &rarr; doctrines</b>, with the Constitution placed third by the hub note. Always read the parent Act before the rule made under it.", "strip": ["Statute", "Rules, regulations, SROs", "Constitution (place open)", "Precedents", "Doctrines"]}, "3": {"intro": "Many problems have no precedent, so the statute itself is what you read. Class gave the structure of a statute and how to use each part to your advantage: <b>structure, preamble, definitions, headings</b>, with <b>external aid</b> (outside the Act) set against <b>internal aid</b> (inside it).", "rails": [{"code": "3.1", "term": "Why read the statute itself", "sub": "Many scenarios have no precedent", "ess": "the method", "prio": 1, "hook": "No precedent? No problem. The statute is the original script; precedent is only the reviews.", "plain": "Class aim: how a statute is <b>structured</b> and how to <b>use it to your advantage</b>. Example raised by the teacher: PECA, a section read as s.24, and whether TikTokers are included. For orientation, s.24 of PECA 2016 is <b>cyber stalking</b>; whether TikTok users fall in it was the teacher&rsquo;s question.", "gap": "No conclusion on the TikTok question was noted. Ask what the teacher concluded.", "links": [{"l": "External aid and internal aid", "m": 3, "sec": "3.2"}]}, {"code": "3.2", "term": "External aid and internal aid", "sub": "Outside the Act, inside the Act", "hook": "External aid asks &ldquo;what does the world say about this Act?&rdquo;; internal aid asks &ldquo;what does the Act say about itself?&rdquo;.", "plain": "<b>Internal aid</b> gives the Act&rsquo;s own meaning and definitions; the rest of the notes go through three internal aids in order: <b>structure, preamble, definitions</b>, then headings. <b>External aid</b> was written as &ldquo;how to read the law?&rdquo;, with ss.379 and 406 PPC (&ldquo;Whoever&hellip;&rdquo;) as examples.", "gap": "A bracket joins ss.379 and 406 PPC to arrows pointing at Internal Aid, so which side the teacher put them on is unclear. The Punjab Act written as &ldquo;PEDA&rdquo; is not identified.", "links": [{"l": "Structure: what every law carries", "m": 3, "sec": "3.3"}, {"l": "3.4", "m": 3, "sec": "3.4"}, {"l": "Definitions: section 2", "m": 3, "sec": "3.5"}, {"l": "3.7", "m": 3, "sec": "3.7"}]}, {"code": "3.3", "term": "Structure: what every law carries", "sub": "Short title, long title, enforcement date, territorial extent", "ess": "statute structure", "prio": 1, "hook": "Read the front page like a passport: <b>who it is, where it is valid, from when</b>.", "src": {"h": "Seen in practice \u00b7 MFLO 1961 and FCA 1964 (as attached)", "paras": [{"t": "Muslim Family Laws Ordinance 1961, s.1: short title; extent is the whole of Pakistan, applying to all Muslim citizens wherever they may be; commencement on a date to be notified.", "l": 0}, {"t": "Family Courts Act 1964 (Punjab text), s.1(2): extends to the whole of the Punjab. s.1(3): in force in such areas and on such dates as Government notifies.", "l": 0}], "f": "MFLO updated till 10-3-2022; Family Courts Act Punjab text, both as attached by Shah."}, "plain": "<b>Every law has</b> a short title, a long title, an enforcement date and territorial extent. They give the broad idea of the law and tell you about <b>retrospective applicability</b>. Class example: the Witness Protection Act does not apply to the provinces. Checked: the federal Witness Protection, Security and Benefit Act 2017 is described as not applicable to the provinces; the provinces have their own laws.", "gap": "The teacher&rsquo;s second example (read as PECA and &ldquo;protection of child victims&rdquo;) does not match the PECA 2016 on cyber offences. Ask which Act he meant.", "links": []}, {"code": "3.4", "term": "Preamble: the purpose of the statute", "sub": "The gist of the law; what mischief it addresses", "ess": "statute structure", "prio": 1, "hook": "The preamble tells you <b>why</b> the Act exists. When the words are cloudy, ask which mischief the Parliament was trying to fix.", "src": {"h": "Preamble in practice \u00b7 class examples", "paras": [{"t": "MFLO 1961 long title: \u201cAn Ordinance to give effect to certain recommendations of the Commission on Marriage and Family Laws\u201d, followed by a WHEREAS recital in the same words.", "l": 0}, {"t": "Illegal Dispossession Act 2005 (Act XI of 2005): long title \u201cAn Act to curb the activities of the property grabbers\u201d; the recital says it is expedient to protect lawful owners and occupiers of immovable property from illegal or forcible dispossession.", "l": 0}, {"t": "Family Courts Act 1964 has a preamble: it is expedient to establish Family Courts for the expeditious settlement and disposal of disputes relating to marriage and family affairs.", "l": 0}], "f": "MFLO and Family Courts Act as attached; IDA from the Sindh Judicial Academy compilation."}, "plain": "<b>Preamble = the gist of the law.</b> It resolves ambiguity, and the question to ask is <b>what mischief was being addressed</b>. <b>Limit:</b> the Supreme Court held that s.3 of the Illegal Dispossession Act is not limited to &ldquo;land grabbers&rdquo; or the &ldquo;Qabza Mafia&rdquo;, because the Act defined the offence without confining it to a class of offender (PLD 2016 SC 769, headnote read on the IBC site). A preamble shows the mischief; it does not cut down clear enacting words.", "gap": "The Urdu word written beside the Illegal Dispossession Act (read as <i>qabza mafia</i>) is not certain.", "links": []}, {"code": "3.5", "term": "Definitions: section 2", "sub": "To save repetition and to classify meaning", "ess": "statute structure", "prio": 1, "hook": "A definition is a fence: &ldquo;means&rdquo; builds it closed, &ldquo;includes&rdquo; leaves the gate open.", "src": {"h": "Definitions in practice \u00b7 Section 2", "paras": [{"t": "MFLO 1961, s.2: opens \u201cunless there is anything repugnant in the subject or context\u201d and defines \u201cArbitration Council\u201d, \u201cChairman\u201d, \u201cPrescribed\u201d, \u201cUnion Council\u201d and \u201cWard\u201d, each with <b>means</b>.", "l": 0}, {"t": "ICT Child Marriage Restraint Act 2025 (Act XI of 2025), s.2(a): \u201cchild\u201d is a person, male or female, under eighteen years of age.", "l": 0}], "f": "MFLO as attached; ICT Act from the Gazette text on the National Assembly site."}, "plain": "Why definitions: <b>to save repetition</b> and <b>to classify meaning</b> (class example: the Child Marriage Restraint Act 2025). The gate above walks the next step: is it defined, and with which verb. Always read the opening words of s.2, which can switch a definition off where the context requires.", "links": [{"l": "\u201cMeans\u201d and \u201cincludes\u201d", "m": 3, "sec": "3.6"}, {"l": "3.7", "m": 3, "sec": "3.7"}]}, {"code": "3.6", "term": "\u201cMeans\u201d and \u201cincludes\u201d", "sub": "Exhaustive and non-exhaustive", "ess": "statute structure", "prio": 1, "hook": "&ldquo;Means&rdquo; says <b>only these</b>; &ldquo;includes&rdquo; says <b>these, and maybe more</b>.", "plain": "&ldquo;<b>Means</b>&rdquo; is an <b>exhaustive</b> definition. &ldquo;<b>Includes</b>&rdquo; is the opposite: <b>non-exhaustive</b>. Class example: &ldquo;property includes movable property&rdquo; is not exhaustive, so it can be argued that it also includes immovable property. Support: <i>Mushtaq Ahmad v The State</i> (1991 SCMR 543) is cited for &ldquo;includes&rdquo; being, as a general rule, a word of enlargement, implying that something beyond the generic meaning also falls within the definition (read on an unofficial case-law site; the SCMR text was not checked). Family Courts Act s.2(1): &ldquo;party&rdquo; <b>shall include</b> any person the Court adds, an inclusive definition.", "wc": {"w": "&ldquo;The definition says includes, so only the listed things are covered.&rdquo;", "r": "&ldquo;The definition says includes, so the list is a floor, not a ceiling; the wider reading must be argued from the text and purpose.&rdquo;"}, "links": [{"l": "3.7", "m": 3, "sec": "3.7"}]}, {"code": "3.7", "term": "When the definition is not in section 2", "sub": "Pari materia", "ess": "statute structure", "hook": "If one Act does not define the word, ask its sister Act.", "plain": "Class gave the name of the doctrine under this question (written &ldquo;Pesimaterial&rdquo;, read as <i>pari materia</i>); the Fri 27 Nov class added the test: same subject and same purpose (Module 8). Meaning checked in general sources: Acts on the same subject, or the same class of persons or things, are read together as one system, each explaining the other. In practice: FCA s.2(1) says &ldquo;Arbitration Council&rdquo; and &ldquo;Chairman&rdquo; take their meaning from the MFLO.", "gap": "The Fri 20 Nov notes gave only the name; the Fri 27 Nov notes give the test (same subject, same purpose), now in Module 8. No Pakistani authority was checked for the doctrine itself.", "links": [{"l": "Pari materia: the two-part test", "m": 8, "sec": "8.2"}, {"l": "8.1", "m": 8, "sec": "8.1"}]}, {"code": "3.8", "term": "Headings, marginal notes and the body", "sub": "The body prevails; a heading does not bind", "ess": "statute structure", "prio": 1, "hook": "A heading is a signpost, not a law. When the signpost and the road disagree, follow the road.", "plain": "<b>Body prevails.</b> If a heading and the body conflict and the body has the wider scope, the body wins. <b>A heading will not bind</b>: the substantive provision is one thing, and the heading and the marginal explanation are others. Example from class: PPC ss.379 and 406 both sit in Chapter XVII &ldquo;Of Offences Against Property&rdquo;; s.379 is the punishment for theft, and s.406 the punishment for criminal breach of trust, opening &ldquo;Whoever commits criminal breach of trust&rdquo;. The Family Courts Act is the class example for headings: its contents list shows a heading for every section (for example s.5 &ldquo;Jurisdiction&rdquo;) and no chapter headings.<br><br>General rule in the sources found: a heading or marginal note cannot control clear words and may be looked at only where the section is ambiguous.", "wc": {"w": "&ldquo;The heading says Offences against Property, so s.406 cannot cover anything else.&rdquo;", "r": "&ldquo;The heading is an aid only; the words of s.406 decide its reach.&rdquo;"}, "gap": "How the &ldquo;Of Offences against Property&rdquo; example was worked, and what the teacher drew from &ldquo;Whoever&rdquo; in ss.379 and 406, is not noted. The Pakistani support found for the general rule is only a one-line extract on an unofficial site.", "links": []}], "spar": [{"q": "The Witness Protection Act 2017 is cited against a provincial case. What do you check first?", "a": "The Act&rsquo;s extent clause (s.1-type provision): the federal Witness Protection, Security and Benefit Act 2017 is described as not applicable to the provinces, which have their own laws. Check the territorial extent before applying any section."}, {"q": "A definition says &ldquo;vehicle includes a motor car&rdquo;. A client has a tractor. How do you argue it is a vehicle?", "a": "&ldquo;Includes&rdquo; is non-exhaustive, so the list is a floor, not a ceiling; argue from the text and purpose that a tractor is within the ordinary meaning of vehicle, and look for a sister Act (pari materia) that defines it. The example is mine; the rule is class&rsquo;s (&ldquo;property includes movable property&rdquo;)."}, {"q": "A heading in a chapter says &ldquo;Of Offences against Property&rdquo; but the section&rsquo;s words cover a wider act. Which prevails?", "a": "The body. Class: if heading and body conflict and the body has wider scope, the body prevails, and a heading does not bind. Use the heading only to resolve real ambiguity."}], "boundary": "<b>Boundary map &middot; definition wording</b><br>Definitions use a bounded set of verbs. Every one we met, classified:<table class=\"btbl\"><tr><th>Wording</th><th>Effect</th><th>Where seen</th></tr><tr><td>means</td><td>Exhaustive: only what is listed</td><td>MFLO s.2 (all five terms)</td></tr><tr><td>includes</td><td>Non-exhaustive: the listed plus more</td><td>Class: property includes movable</td></tr><tr><td>shall include</td><td>Inclusive (the Court may add)</td><td>FCA s.2(1) &ldquo;party&rdquo;</td></tr><tr><td>means and includes, or any other wording</td><td>Not covered in class: read the text</td><td>&mdash;</td></tr></table>", "recall": "<b class=\"hl\">Recall</b>Front page first: <b>title, extent, date</b>. Then <b>preamble</b> (mischief), <b>s.2</b> (means shuts, includes opens), then <b>pari materia</b> if the word is missing. Headings guide; the body rules.", "check": {"h": "Reading checklist \u00b7 tick as you go", "intro": "Run these in order the first time you open any Act. Ticks are saved on this device.", "items": ["Short title and territorial extent: does the Act reach my place and my people? (e.g. the Witness Protection Act does not reach the provinces)", "Enforcement date: does it say anything about retrospective effect?", "Long title and preamble: what mischief was the Act written to address?", "Section 2: is my word defined, and does the definition say &ldquo;means&rdquo; or &ldquo;includes&rdquo;?", "Word not in s.2: is there another Act on the same subject (pari materia)?", "Headings and marginal notes: used only to resolve doubt, never to cut down clear words in the body.", "Is the text I am reading up to date with amendments? (my addition, standard practice)"]}, "gate": {"title": "Gate \u00b7 reading a definition", "start": "s1", "steps": {"s1": {"q": "Is the word defined in the Act\u2019s definitions section (usually s.2)?", "law": "Class: definitions are in Sec 2, to save repetition and to classify meaning.", "hint": "Check the opening words too: the MFLO s.2 begins \u201cunless there is anything repugnant in the subject or context\u201d.", "yes": "s2", "no": "s5"}, "s2": {"q": "Does the definition use the word \u201cmeans\u201d?", "law": "\u201cMeans\u201d gives an exhaustive definition (class).", "hint": "Look at the exact verb in the definition.", "yes": {"end": "Exhaustive. Only what the definition lists falls in. Do not add to it, subject to the opening words about context.", "tone": "ok"}, "no": "s3"}, "s3": {"q": "Does it use \u201cincludes\u201d or \u201cshall include\u201d?", "law": "\u201cIncludes\u201d is the opposite of means: non-exhaustive (class). FCA s.2(1): \u201cparty\u201d shall include any person the Court adds.", "hint": "Class example: \u201cproperty includes movable property\u201d does not close the list.", "yes": {"end": "Non-exhaustive. The listed things are in, and more can be argued in. Example from class: property includes movable property, but it can be argued to include immovable property too.", "tone": "ok"}, "no": {"end": "Wording the class did not cover (for example \u201cmeans and includes\u201d). Read the exact text and its context; do not assume either rule.", "tone": "warn"}}, "s5": {"q": "Is there another Act on the same subject that defines the word?", "law": "Class named the doctrine of pari materia for a definition not found in Sec 2.", "hint": "Example: the Family Courts Act takes \u201cArbitration Council\u201d from the MFLO.", "yes": {"end": "Read the two Acts together as one system (pari materia). Example: FCA s.2(1) takes \u201cArbitration Council\u201d and \u201cChairman\u201d from the MFLO.", "tone": "ok"}, "no": {"end": "No defining Act found. Take the ordinary dictionary meaning, but not one contrary to what the law intended (class, Fri 27 Nov). Module 8 has the full gate.", "tone": "warn"}}}}}, "4": {"intro": "<b>Jurisdiction</b> is the first thing to fix in any matter: the teacher&rsquo;s &ldquo;Fundamental Qs&rdquo; box opens with <b>\u2460 Which forum?</b> (the second question is blank in the notes). The text of every Article below is the bare Constitution as amended to the 27th Amendment, so it includes the Federal Constitutional Court.", "rails": [{"code": "175(2)", "term": "Jurisdiction comes from law", "sub": "No court acts without it", "ess": "forum", "prio": 1, "hook": "A court without jurisdiction is a chef in the wrong kitchen: the biryani may be perfect, but it was never his to cook. The word itself tells you: <i>juris</i> + <i>diction</i>, &ldquo;to speak the law&rdquo; (the teacher&rsquo;s word-root note).", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 175 (Establishment and jurisdiction of courts)", "paras": [{"t": "(2) No court shall have any jurisdiction save as is or may be conferred on it by the Constitution or by or under any law.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "First fix <b>which forum</b>. A court has only the jurisdiction the Constitution or a law gives it. Art. 175(1) also lists the courts: the Federal Constitutional Court, the Supreme Court, a High Court for each Province and for Islamabad, and other courts set up by law.", "links": [{"l": "The four-question inquiry", "m": 1, "sec": "1.3"}, {"l": "175E", "m": 4, "sec": "175E"}, {"l": "199", "m": 4, "sec": "199"}]}, {"code": "tree", "term": "The court structure as drawn", "sub": "SCP, FCC and FSC at the top; High Court; district judiciary; tribunals", "tag": "Teacher\u2019s drawing", "hook": "&ldquo;It&rsquo;s a castle! This structure matters!&rdquo; (the teacher, beside the district judiciary).", "plain": "From the drawing: <b>Supreme Court (SCP)</b>, noted as Art. 185; <b>Federal Constitutional Court (FCC)</b>, Art. 175E; <b>Federal Shariat Court (FSC)</b>, &ldquo;Art. 203 + others&rdquo;; <b>High Court</b>, Art. 199, below the SCP and FCC; the <b>district judiciary</b> below it; <b>tribunals</b>, Art. 212, whose decisions bind for precedent through the High Court, with appeals directly to the SCP.<br><br>Each article is now checked against the bare text: 185 is the Supreme Court&rsquo;s appellate article; 175E and 175F are the FCC; 199 is the High Court&rsquo;s writ jurisdiction; 203 is the High Court&rsquo;s supervision of subordinate courts; the Federal Shariat Court sits in 203A to 203J; Art. 212(3) gives a Supreme Court appeal on leave.", "gap": "The FSC label (&ldquo;Art. 203 + others&rdquo;) matches only in part: the FSC article is 203C. Whether the tribunal&rsquo;s decisions bind through Art. 201 is the teacher&rsquo;s statement; the text of Art. 201 speaks only of &ldquo;courts subordinate&rdquo;.", "links": [{"l": "175E", "m": 4, "sec": "175E"}, {"l": "175F", "m": 4, "sec": "175F"}, {"l": "185", "m": 4, "sec": "185"}, {"l": "199", "m": 4, "sec": "199"}, {"l": "203", "m": 4, "sec": "203"}, {"l": "212", "m": 4, "sec": "212"}]}, {"code": "175E", "term": "Federal Constitutional Court: original jurisdiction", "sub": "Disputes between Governments; Fundamental Rights; the record of a case", "ess": "forum", "prio": 1, "hook": "Two governments in a quarrel are not a case for a civil judge; they go to the one court built for them.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 175E (Original jurisdiction of Federal Constitutional Court)", "paras": [{"t": "(1) The Federal Constitutional Court shall, to the exclusion of every other court, have original jurisdiction in any dispute between any two or more Governments.", "l": 0}, {"t": "Explanation.\u2014In this clause, \u201cGovernments\u201d means the Federal Government and the Provincial Governments.", "l": 0}, {"t": "(2) In the exercise of the jurisdiction conferred on it by clause (1), the Federal Constitutional Court shall pronounce declaratory judgments only.", "l": 0}, {"t": "(3) Without prejudice to the provisions of Article 199, the Federal Constitutional Court shall, if it considers that a question of public importance with reference to the enforcement of any of the Fundamental Rights conferred by Chapter 1 of Part II is involved, have the power to make an order of the nature mentioned in the said Article:", "l": 0}, {"t": "Provided that, subject to the satisfaction of the Federal Constitutional Court, the jurisdiction under this clause shall only be exercised if an application is filed by a person in that Court.", "l": 0}, {"t": "(5) The Federal Constitutional Court may, on its own motion or otherwise, if it considers that the case involves a substantial question of law as to the interpretation of the Constitution, call for the record of any case pending before any court and make such order in the case as it thinks fit.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "Inserted by the 27th Amendment (13 Nov 2025). <b>(1)</b> exclusive original jurisdiction in any dispute between Governments. <b>(2)</b> declaratory judgments only. <b>(3)</b> a Fundamental Rights order like Art. 199, on an application. <b>(5)</b> it may call for the record of a case with a substantial question about the Constitution&rsquo;s interpretation.", "links": [{"l": "175F", "m": 4, "sec": "175F"}, {"l": "189", "m": 5, "sec": "189"}]}, {"code": "175F", "term": "Appeals to the Federal Constitutional Court", "sub": "From High Court judgments, decrees, final orders and sentences", "ess": "forum", "prio": 1, "hook": "Three doors from the High Court to the FCC: a statute opens one, a certificate opens another, leave opens the third.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 175F (Appellate jurisdiction of the Federal Constitutional Court)", "paras": [{"t": "(1) The Federal Constitutional Court shall have jurisdiction to hear and determine appeals from judgments, decrees, final orders or sentences of a High Court as provided herein below \u2014 (a) where an Act of Majlis-e-Shoora (Parliament) so provides; (b) if the High Court certifies that the case involves a substantial question of law as to the interpretation of the Constitution; or (c) from a judgment or an order of a High Court made under Article 199 only if the Federal Constitutional Court grants leave to appeal:", "l": 0}, {"t": "Provided that no appeal shall lie against a judgment or an order of a High Court made under Article 199, in a case which relates to rent and family except guardianship and such other matters as may be determined by law.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "An appeal lies <b>(a)</b> where an Act of Parliament says so, <b>(b)</b> if the High Court certifies a substantial question about interpreting the Constitution, or <b>(c)</b> from an Art. 199 order only if the FCC grants leave. The proviso shuts the door on Art. 199 orders in rent and family cases (guardianship excepted).", "links": [{"l": "185", "m": 4, "sec": "185"}, {"l": "199", "m": 4, "sec": "199"}]}, {"code": "185", "term": "Supreme Court: appeals from the High Court", "sub": "Appeal as of right in some cases, otherwise by leave", "ess": "forum", "hook": "Appeal as of right is a short list; everything else needs the Court&rsquo;s leave.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 185 (Appellate jurisdiction of the Supreme Court)", "paras": [{"t": "(1) Subject to this Article and Article 175F, the Supreme Court shall have jurisdiction to hear and determine appeals from judgments, decrees, final orders or sentences of a High Court.", "l": 0}, {"t": "(2) An appeal shall lie to the Supreme Court from any judgment, decree, final order or sentence of a High Court\u2014 (a) if the High Court has on appeal reversed an order of acquittal of an accused person and sentenced him to death or to transportation for life or imprisonment for life; or, on revision, has enhanced a sentence to a sentence as aforesaid; or (b) if the High Court has withdrawn for trial before itself any case from any court subordinate to it and has in such trial convicted the accused person and sentenced him as aforesaid; or (c) if the High Court has imposed any punishment on any person for contempt of the High Court; or (d) if the amount or value of the subject-matter of the dispute in the court of first instance was, and also in dispute in appeal is, not less than one million rupees or such other sum as may be specified in that behalf by Act of Majlis-e-Shoora (Parliament) and the judgment, decree or final order appealed from has varied or set aside the judgment, decree or final order of the court or tribunal immediately below; or (e) if the judgment, decree or final order involves directly or indirectly some claim or question respecting property of the like amount or value and the judgment, decree or final order appealed from has varied or set aside the judgment, decree or final order of the court or tribunal immediately below.", "l": 0}, {"t": "(3) An appeal to the Supreme Court, from a judgment, decree, order or sentence of a High Court in case to which clause (2) does not apply shall lie only if the Supreme Court grants leave to appeal:", "l": 0}, {"t": "Provided that no appeal shall lie to the Supreme Court in cases to which clause (1) of Article 175F applies.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "The Supreme Court hears appeals from High Courts, subject to Art. 185 and Art. 175F. Clause (2) lists cases where the appeal lies as of right (including some death or life sentences, contempt, and property worth the stated amount or more); in the others <b>leave to appeal</b> is needed (clause 3). It also confirms the teacher&rsquo;s &ldquo;185&rdquo; reading for the Supreme Court&rsquo;s appellate article.", "links": [{"l": "175F", "m": 4, "sec": "175F"}, {"l": "212", "m": 4, "sec": "212"}]}, {"code": "199", "term": "High Court: writs and the adequate remedy test", "sub": "Alternative, effective, efficacious", "ess": "forum", "prio": 1, "hook": "The High Court is the court of last resort in the <i>first</i> instance: you must show you have no other adequate road before it will take the case.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 199 (Jurisdiction of High Court)", "paras": [{"t": "(1) Subject to the Constitution, a High Court may, if it is satisfied that no other adequate remedy is provided by law,\u2014", "l": 0}, {"t": "(a) on the application of any aggrieved party, make an order\u2014", "l": 1}, {"t": "(i) directing a person performing, within the territorial jurisdiction of the Court, functions in connection with the affairs of the Federation, a Province or a local authority, to refrain from doing anything he is not permitted by law to do, or to do anything he is required by law to do ; or", "l": 1}, {"t": "(ii) declaring that any act done or proceeding taken within the territorial jurisdiction of the Court by a person performing functions in connection with the affairs of the Federation, a Province or a local authority has been done or taken without lawful authority and is of no legal effect; or", "l": 1}, {"t": "(b) on the application of any person, make an order\u2014", "l": 1}, {"t": "(i) directing that a person in custody within the territorial jurisdiction of the Court be brought before it so that the Court may satisfy itself that he is not being held in custody without lawful authority or in an unlawful manner; or", "l": 1}, {"t": "(ii) requiring a person within the territorial jurisdiction of the Court holding or purporting to hold a public office to show under what authority of law he claims to hold that office ; or", "l": 1}, {"t": "(c) on the application of any aggrieved person, make an order giving such directions to any person or authority, including any Government exercising any power or performing any function in, or in relation to, any territory within the jurisdiction of that Court as may be appropriate for the enforcement of any of the Fundamental Rights conferred by Chapter 1 of Part II.", "l": 1}, {"t": "(1A) For removal of doubt, the High Court shall not make an order or give direction or make a declaration on its own or in the nature of suo motu exercise of jurisdiction beyond the contents of any application filed under clause (1).", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "<b>The flow from class:</b> Art. 199 applies where there is no alternative, effective, efficacious remedy &rarr; decided by a <b>Single Bench</b> &rarr; <b>intra-court appeal</b> under the Law Reforms Ordinance 1972 s.3(2) &rarr; appeal, review or challenge. The teacher&rsquo;s three words are shorthand for the opening test: <b>no other adequate remedy is provided by law</b>. s.3(2) of the Ordinance gives an appeal to a bench of two or more judges from a Single Judge&rsquo;s order under Art. 199(1), subject to its own exceptions (seen in a Lahore High Court intra-court appeal judgment). The handwriting reads &ldquo;Land Reforms Ordinance&rdquo;; the intra-court appeal law is the Law Reforms Ordinance 1972.", "gap": "The 20-day period for filing an intra-court appeal was seen only on a second-hand copy and is not used here. The exceptions in s.3(2) of the Ordinance were not read word for word.", "links": [{"l": "Armed Forces and Art. 199", "m": 4, "sec": "245"}, {"l": "175F", "m": 4, "sec": "175F"}]}, {"code": "203", "term": "High Court supervises subordinate courts", "sub": "The district judiciary below the High Court", "hook": "The district judge answers upward: the High Court holds the leash.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 203 (High Court to superintend subordinate courts)", "paras": [{"t": "Each High Court shall supervise and control all courts subordinate to it.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "Short but powerful: each High Court supervises and controls all courts subordinate to it. This is the constitutional link between the High Court and the district judiciary of the &ldquo;castle&rdquo;. It also shapes Art. 201 (decisions of the High Court bind courts subordinate to it).", "links": [{"l": "Art. 201: High Court decisions", "m": 5, "sec": "201"}]}, {"code": "212", "term": "Tribunals and administrative courts", "sub": "Exclusive jurisdiction; appeal to the Supreme Court by leave", "tag": "Tribunals", "hook": "Where a tribunal is set up for the subject, the ordinary court must step aside.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 212 (Administrative Courts and Tribunals)", "paras": [{"t": "(1) Notwithstanding anything hereinbefore contained the appropriate Legislature may by Act provide for the establishment of one or more Administrative Courts or Tribunals to exercise exclusive jurisdiction in respect of\u2014", "l": 0}, {"t": "(a) matters relating to the terms and conditions of persons who are or have been in the service of Pakistan, including disciplinary matters", "l": 1}, {"t": "(b) matters relating to claims arising from tortious acts of Government, or any person in the service of Pakistan, or of any local or other authority empowered by law to levy any tax or cess and any servant of such authority acting in the discharge of his duties as such servant; or", "l": 1}, {"t": "(c) matters relating to the acquisition, administration and disposal of any property which is deemed to be enemy property under any law.", "l": 1}, {"t": "(2) Notwithstanding anything hereinbefore contained where any Administrative Court or Tribunal is established under clause (1), no other court shall grant an injunction, make any order or entertain any proceedings in respect of any matter to which the jurisdiction of such Administrative Court or Tribunal extends and all proceedings in respect of any such matter which may be pending before such other court immediately before the establishment of the Administrative Court or Tribunal ; other than an appeal pending before the Supreme Court, shall abate on such establishment:", "l": 0}, {"t": "Provided that the provisions of this clause shall not apply to an Administrative Court or Tribunal established under an Act of a Provincial Assembly unless, at the request of that Assembly made in the form of a resolution, Majlis-e-Shoora (Parliament) by law extends the provisions to such a Court or Tribunal.", "l": 0}, {"t": "(3) An appeal to the Supreme Court from a judgment, decree, order or sentence of an Administrative Court or Tribunal shall lie only if the Supreme Court, being satisfied that the case involves a substantial question of law of public importance, grants leave to appeal.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "The legislature may set up tribunals to take exclusive jurisdiction over service matters, tort claims against the Government and enemy property. <b>212(2)</b>: no other court may grant an injunction or entertain proceedings on that subject. <b>212(3)</b>: an appeal to the Supreme Court lies only if it grants leave, on a substantial question of law of public importance. This matches the teacher&rsquo;s &ldquo;appeals go directly to SCP&rdquo;.", "links": [{"l": "185", "m": 4, "sec": "185"}]}, {"code": "245", "term": "Armed Forces and Art. 199", "sub": "When the High Court\u2019s writ power is suspended", "tag": "Limit on 199", "hook": "A writ court cannot follow soldiers into an area where they are acting in aid of civil power.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 245 (Functions of Armed Forces)", "paras": [{"t": "(3) A High Court shall not exercise any jurisdiction under Article 199 in relation to any area in which the Armed Forces of Pakistan are, for the time being, acting in aid of civil power in pursuance of Article 245:", "l": 0}, {"t": "Provided that this clause shall not be deemed to affect the jurisdiction of the High Court in respect of any proceeding pending immediately before the day on which the Armed Forces start acting in aid of civil power.", "l": 0}, {"t": "(4) Any proceeding in relation to an area referred to in clause (3) instituted on or after the day the Armed Forces start acting in aid of civil power and pending in any High Court shall remain suspended for the period during which the Armed Forces are so acting.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "Art. 245(3): a High Court shall not exercise Art. 199 jurisdiction in an area where the Armed Forces are acting in aid of civil power under Art. 245; proceedings already pending are saved by the proviso, and new ones stay suspended while the Forces so act (245(4)). The Armed Forces act under the directions of the Federal Government (245(1)).", "gap": "The teacher&rsquo;s starred line says the FCC invoked Art. 245 to suspend the High Court&rsquo;s habeas corpus power. Who invoked it, and when, is not stated, and the text of Art. 245 puts the direction with the Federal Government, so the line is not used as law.", "links": [{"l": "199", "m": 4, "sec": "199"}]}, {"code": "crim", "term": "Criminal courts and appeals", "sub": "CrPC s.6, ss.410 and 415, s.199", "tag": "Criminal side", "hook": "Crime has its own staircase: Magistrate or Court of Session at the bottom, the High Court on top for appeals.", "plain": "<b>As noted:</b> s.6 CrPC defines the hierarchy of criminal courts, the Court of Session and Magistrates (noted as CoS, MFC, MSC); <b>ordinary court</b> against <b>special court</b>; CrPC <b>410 and 415</b> give appellate jurisdiction to the High Court; s.199 is starred, &ldquo;the limits!&rdquo;.<br><br>Checked: s.6 is headed <i>Classes of Criminal Courts and Magistrates</i>, and s.410 is headed <i>Appeal from sentence of Court of Session</i> (contents list of the Code, amended to 31 Dec 2022); s.246 shows as omitted.", "gap": "&ldquo;246/247 CrPC&rdquo;, the word after &ldquo;Section 199&rdquo; and &ldquo;NTCO App + Study&rdquo; are unclear. Not interpreted.", "links": []}, {"code": "civ", "term": "Civil side: the four-step jurisdiction check", "sub": "Check, review, CPC and precedent, then SB, ICA, DB", "tag": "Civil side", "hook": "Check the door, check the lock, then climb.", "plain": "As drawn: <b>1</b> check jurisdiction; <b>2</b> review jurisdiction; <b>3</b> CPC then case law or precedent check; <b>4</b> SB &rarr; ICA &rarr; DB (single bench, intra-court appeal, division bench). Starred for study: the <b>Illegal Dispossession Act</b> (Act XI of 2005, dated 6 July 2005, a special law against property grabbers) and the FCC entry (&ldquo;175 B-L&rdquo;, which matches Chapter 1A of the bare text, Arts 175B to 175L).", "gap": "How the four steps link to the court tree is not explained, and the wording of steps 1 and 2 is a best reading. The Punjab Protection of Ownership of Immovable Property Act 2025 was suspended by the Lahore High Court on 22 Dec 2025 (APP); its present status is not checked.", "links": [{"l": "199", "m": 4, "sec": "199"}, {"l": "175E", "m": 4, "sec": "175E"}]}], "spar": [{"q": "A client wants to sue the Federal Government over a service matter. Which forum, and which Article shuts the ordinary court out?", "a": "If a tribunal has been set up for service matters, the tribunal has exclusive jurisdiction and Art. 212(2) bars other courts from entertaining the matter. Appeal to the Supreme Court is only by leave (212(3)). Whether a tribunal exists for the particular service must be checked first."}, {"q": "A person is detained and nothing is pending. Which court, and what test must you meet?", "a": "The High Court under Art. 199(1)(b)(i), on the application of any person, but only if there is no other adequate remedy provided by law. Check Art. 245(3) if the Armed Forces are acting in aid of civil power in that area."}, {"q": "The teacher wrote the FSC as &ldquo;Art. 203 + others&rdquo;. What does the bare text say?", "a": "Art. 203 on its own says each High Court supervises and controls courts subordinate to it. The Federal Shariat Court is in Chapter 3A, Arts 203A to 203J (203C is &ldquo;The Federal Shariat Court&rdquo;). So the teacher&rsquo;s &ldquo;+ others&rdquo; is the right instinct, but the FSC provisions are 203A onwards."}], "boundary": "<b>Boundary map &middot; who hears an appeal from a High Court</b><br>The routes are a bounded set. Every route in Arts 175F and 185 classified:<table class=\"btbl\"><tr><th>High Court judgment</th><th>Goes to</th><th>Condition</th></tr><tr><td>Act of Parliament gives an appeal</td><td>FCC</td><td>175F(1)(a)</td></tr><tr><td>High Court certifies a substantial question of constitutional interpretation</td><td>FCC</td><td>175F(1)(b)</td></tr><tr><td>Art. 199 order</td><td>FCC</td><td>Only with leave (175F(1)(c))</td></tr><tr><td>Art. 199 order in a rent or family case (guardianship excepted)</td><td>No appeal</td><td>Proviso to 175F(1)</td></tr><tr><td>The cases listed in 185(2), for example: acquittal reversed and sentence of death or life; contempt of the High Court; property of the stated value or more where the judgment varied or set aside the one below</td><td>Supreme Court as of right</td><td>185(2)</td></tr><tr><td>Anything else</td><td>Supreme Court</td><td>Only if leave is granted (185(3))</td></tr><tr><td>Any case where 175F(1) applies</td><td>Not the Supreme Court</td><td>Proviso to 185(3)</td></tr></table>Note the cases where an Act of Parliament, or a certificate, is needed first: you cannot tell the route from the court alone.", "recall": "<b class=\"hl\">Recall</b>First question: <b>which forum?</b> Source: <b>175(2)</b>. Top: <b>FCC 175E/F, SC 185, FSC 203A&ndash;J</b>. Middle: <b>High Court 199, supervising 203</b>. Bottom: <b>district courts, tribunals 212</b>. Armed Forces in aid of civil power switch off 199 (245(3)).", "gate": {"title": "Gate \u00b7 which court?", "start": "s1", "steps": {"s1": {"q": "Is the dispute between two or more Governments (the Federal Government and the Provincial Governments)?", "law": "Art. 175E(1): original jurisdiction of the Federal Constitutional Court, to the exclusion of every other court.", "hint": "\u201cGovernments\u201d means
