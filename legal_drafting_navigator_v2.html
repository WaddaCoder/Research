the Federal and the Provincial Governments (explanation to 175E(1)).", "yes": {"end": "Federal Constitutional Court, original jurisdiction, exclusive. It gives declaratory judgments only (Art. 175E(2)).", "tone": "ok"}, "no": "s2"}, "s2": {"q": "Is a service, Government-tort or enemy-property matter covered by a tribunal set up by law (Art. 212)?", "law": "Art. 212(2): where a tribunal is set up, no other court grants an injunction or entertains proceedings on its subject.", "hint": "Think of service matters, tort claims against the Government, and enemy property.", "yes": {"end": "Go to the tribunal. Other courts are shut out (Art. 212(2)); an appeal to the Supreme Court lies only on leave, where there is a substantial question of law of public importance (Art. 212(3)). The tribunal\u2019s own Act may differ for provincial tribunals (proviso to 212(2)).", "tone": "ok"}, "no": "s3"}, "s3": {"q": "Are you challenging an act of a person performing functions for the Federation, a Province or a local authority, or seeking a habeas corpus-type order, with no other adequate remedy?", "law": "Art. 199(1): the High Court may act if satisfied that no other adequate remedy is provided by law.", "hint": "The teacher\u2019s shorthand for the test: alternative, effective, efficacious.", "yes": "s4", "no": {"end": "An ordinary civil or criminal matter. Start in the ordinary court set up by law (the district judiciary; for crime the Court of Session or a Magistrate, CrPC s.6), then climb by appeal: the High Court, then the courts above it (Arts 175F and 185).", "tone": "ok"}}, "s4": {"q": "Are the Armed Forces acting in aid of civil power under Art. 245 in the area where the matter arose?", "law": "Art. 245(3): a High Court shall not exercise Art. 199 jurisdiction in an area where the Armed Forces are acting in aid of civil power; the proviso saves proceedings pending before they began.", "hint": "Look at the proviso: it covers proceedings pending immediately before the Armed Forces start acting.", "yes": {"end": "Art. 199 jurisdiction is not exercisable in that area while the Armed Forces are so acting (Art. 245(3)); new proceedings filed after that day stay suspended (245(4)). Check the proviso for matters already pending.", "tone": "warn"}, "no": {"end": "High Court, Art. 199, a Single Bench first. Appeal goes by intra-court appeal under the Law Reforms Ordinance 1972 s.3(2) to a bench of two or more judges; beyond the High Court see Arts 175F and 185.", "tone": "ok"}}}}, "finder": {"h": "Forum Finder", "intro": "Type a situation or a forum, or scroll. Tap a result to open its Article.", "ph": "e.g. government, tribunal, appeal, writ, habeas\u2026", "items": [{"q": "Federal Government against a Province, or one Province against another", "f": "Federal Constitutional Court", "a": "175E(1)", "n": "Exclusive original jurisdiction; declaratory judgments only.", "l": {"l": "175E", "m": 4, "sec": "175E"}}, {"q": "Fundamental Rights question of public importance", "f": "Federal Constitutional Court (on application) or High Court", "a": "175E(3), 199(1)(c)", "n": "The FCC may make an order of the nature mentioned in Art. 199, without prejudice to Art. 199, only on an application filed in that Court.", "l": {"l": "175E", "m": 4, "sec": "175E"}}, {"q": "Appeal from a High Court judgment, an Act of Parliament gives the right", "f": "Federal Constitutional Court", "a": "175F(1)(a)", "n": "Also where the High Court certifies a substantial question about interpreting the Constitution (175F(1)(b)).", "l": {"l": "175F", "m": 4, "sec": "175F"}}, {"q": "Appeal against a High Court order under Art. 199", "f": "Federal Constitutional Court, by leave", "a": "175F(1)(c)", "n": "No appeal against an Art. 199 order in a case relating to rent and family except guardianship, and such matters as law decides.", "l": {"l": "175F", "m": 4, "sec": "175F"}}, {"q": "Appeal from a High Court in other cases", "f": "Supreme Court", "a": "185", "n": "Subject to Art. 175F. Some appeals as of right (clause 2); otherwise only if leave is granted (clause 3). No appeal to the Supreme Court where 175F(1) applies.", "l": {"l": "185", "m": 4, "sec": "185"}}, {"q": "Writ against an authority acting for the Federation, a Province or local authority", "f": "High Court", "a": "199(1)(a)", "n": "Only if no other adequate remedy is provided by law; on application of any aggrieved party.", "l": {"l": "199", "m": 4, "sec": "199"}}, {"q": "A person is detained without lawful authority", "f": "High Court", "a": "199(1)(b)(i)", "n": "On the application of any person: bring the person before the Court.", "l": {"l": "199", "m": 4, "sec": "199"}}, {"q": "Who supervises the district courts?", "f": "High Court", "a": "203", "n": "Each High Court supervises and controls all courts subordinate to it.", "l": {"l": "203", "m": 4, "sec": "203"}}, {"q": "Service matter or Government tort claim where a tribunal exists", "f": "Tribunal", "a": "212(1), (2)", "n": "Other courts are barred; appeal to the Supreme Court only by leave on a substantial question of law of public importance (212(3)).", "l": {"l": "212", "m": 4, "sec": "212"}}, {"q": "Is a law repugnant to the Injunctions of Islam?", "f": "Federal Shariat Court", "a": "203C and Chapter 3A", "n": "The Court may examine whether a law is repugnant to the Injunctions of Islam (203D(1)). The teacher noted \u201cArt. 203 + others\u201d; the bare text puts the Federal Shariat Court in Chapter 3A, Arts 203A to 203J, while Art. 203 alone is the High Court\u2019s supervision of subordinate courts.", "l": {"l": "203", "m": 4, "sec": "203"}}, {"q": "Any court: where do I find the jurisdiction at all?", "f": "Constitution or a law", "a": "175(2)", "n": "No court has jurisdiction except what the Constitution or a law confers.", "l": {"l": "Jurisdiction comes from law", "m": 4, "sec": "175(2)"}}]}}, "5": {"intro": "A <b>precedent</b> is a past decision that a court must, or may, follow. This module covers what precedent is, the parts of a judgment, what binds under <b>Arts 189 and 201</b>, how a past judgment re-enters a new case, and the vertical and horizontal lines of stare decisis. When a precedent does not bind is the next module.", "rails": [{"code": "5.1", "term": "What a precedent is", "sub": "Two definitions and the maxim behind them", "ess": "precedent", "prio": 1, "hook": "<i>Stare decisis et non quieta movere</i>: stand by what has been decided, and do not disturb the settled. Judges are creatures of habit on purpose.", "plain": "Two working definitions written down: a <b>decision made by a court that decides a principle of law</b>; and <b>any decision given by the court</b>. Stare decisis: &ldquo;stand by things already decided, do not disturb the already established&rdquo;, and &ldquo;things so adjudged ought to rest in peace&rdquo;. Historically a <b>control mechanism</b> in common-law courts.<br><br>The authority the teacher called &ldquo;Vamanrao v Union of India (1981)&rdquo; is <i>Waman Rao v Union of India</i> (1981) 2 SCC 362, a five-judge bench of the Supreme Court of India, cited for the maxim.", "gap": "The &ldquo;rest in peace&rdquo; line is described in an Indian law blog as Lord Coke&rsquo;s classic English rendering; the snippet read was cut off, so the attribution is not fully checked.", "links": [{"l": "Types of precedent", "m": 5, "sec": "5.2"}]}, {"code": "5.2", "term": "Types of precedent", "sub": "Binding, original, persuasive", "tag": "Types", "hook": "Binding precedent is an order; persuasive precedent is advice from a senior colleague.", "plain": "Written as: <b>Binding</b> (Arts 189 and 201); <b>Original</b> (parent); <b>Persuasive</b>. Beside <b>Binding</b>: <b>stare decisis</b> (obiter) and <b>ratio</b>.", "gap": "The meaning of &ldquo;original (parent)&rdquo; and the link between stare decisis, obiter and ratio at that line are not explained in the notes.", "links": [{"l": "189", "m": 5, "sec": "189"}, {"l": "Art. 201: High Court decisions", "m": 5, "sec": "201"}, {"l": "Ratio and obiter", "m": 5, "sec": "5.4"}]}, {"code": "5.3", "term": "Elements of a judgment", "sub": "Jurisdiction, facts, arguments, deliberation, decision", "hook": "Read a judgment as a story in five beats: who came, what happened, what they said, what the judge thought, what he ordered.", "plain": "(a) Who has invoked the <b>jurisdiction</b>? (b) <b>Facts</b> of the case. (c) <b>Arguments</b> of the parties. (d) <b>Deliberation</b>, bracketed with &ldquo;precedent (application)!&rdquo;. (e) <b>Decision</b>. The deliberation is where the <b>ratio decidendi</b> lives.", "links": [{"l": "Ratio and obiter", "m": 5, "sec": "5.4"}]}, {"code": "5.4", "term": "Ratio and obiter", "sub": "What binds and what only floats past", "ess": "precedent", "prio": 1, "hook": "The ratio is the reason the case came out as it did; the obiter is the judge&rsquo;s chat on the way out.", "plain": "<b>Ratio decidendi</b> comes from the deliberation. <b>Obiter dicta</b> are the other things said: <b>not binding</b> generally. The teacher noted an exception, &ldquo;e.g. NAB limit jurisdiction&rdquo;, and wrote &ldquo;even remarks made by superior courts all binding&rdquo;. Support found: Pakistani courts have said subordinate courts cannot ignore even the obiter dicta of the apex court (The News, &ldquo;Law of binding precedents&rdquo;).", "wc": {"w": "&ldquo;That is only obiter, so I can ignore it.&rdquo;", "r": "&ldquo;That is obiter, so it does not bind by itself, but it is the apex court&rsquo;s view and a subordinate court cannot simply ignore it.&rdquo;"}, "gap": "The NAB example is cryptic (which case, what limit). The &ldquo;even remarks&rdquo; line is a best reading.", "links": []}, {"code": "189", "term": "Art. 189: FCC and Supreme Court decisions", "sub": "What binds, and whom", "ess": "what binds", "prio": 1, "hook": "Two top courts, one ranking: the FCC binds everyone, the Supreme Court binds everyone but the FCC.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 189 (Decisions of Federal Constitutional Court and Supreme Court binding on other Courts)", "paras": [{"t": "(1) Any decision of the Federal Constitutional Court shall, to the extent that it decides a question of law or is based upon or enunciates a principle of law, be binding on all other courts in Pakistan including the Supreme Court.", "l": 0}, {"t": "(2) Any decision of the Supreme Court shall, to the extent that it decides a question of law or is based upon or enunciates a principle of law, be binding on all other courts in Pakistan except the Federal Constitutional Court.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "Binding only <b>to the extent</b> the decision decides a question of law or is based upon or enunciates a principle of law. <b>(1) FCC</b>: binds all other courts <b>including the Supreme Court</b>. <b>(2) Supreme Court</b>: binds all other courts <b>except the FCC</b>. The teacher&rsquo;s table matches the text.", "gap": "Still contested in practice: in May 2026 the Chief Justice of Pakistan held that the SC and FCC are coordinate courts with demarcated jurisdictions (Dawn, Tribune, 6 May 2026); on 5 Nov 2026 the FCC again said its legal observations bind the SC (Tribune); the FCC has also said earlier SC rulings are persuasive, not binding, on it.", "links": [{"l": "Art. 201: High Court decisions", "m": 5, "sec": "201"}, {"l": "The three exceptions", "m": 6, "sec": "6.1"}]}, {"code": "201", "term": "Art. 201: High Court decisions", "sub": "\u201cSubject to Art. 189\u201d: FCC and SC come first", "ess": "what binds", "prio": 1, "hook": "&ldquo;Subject to Art. 189&rdquo; is the queue rule: the FCC and the Supreme Court stand ahead of the High Court.", "src": {"h": "Bare text \u00b7 Constitution of Pakistan \u00b7 Art. 201 (Decision of High Court binding on subordinate courts)", "paras": [{"t": "Subject to Article 189, any decision of a High Court shall, to the extent that it decides a question of law or is based upon or enunciates a principle of law, be binding on all courts subordinate to it.", "l": 0}], "f": "Constitution (14th ed.), as amended up to the Twenty-seventh Amendment."}, "plain": "<b>Subject to Art. 189</b> means the FCC and SC come first (the first gate). If no FCC or SC decision is available, the <b>High Court</b> decision is the precedent, and it binds <b>all courts subordinate to it</b>. If two High Courts differ, a subordinate court follows <b>its own High Court</b> (Business Recorder report of a Supreme Court judgment).", "links": [{"l": "189", "m": 5, "sec": "189"}, {"l": "5.7", "m": 5, "sec": "5.7"}, {"l": "203", "m": 4, "sec": "203"}]}, {"code": "5.7", "term": "Vertical and horizontal stare decisis", "sub": "Binding up and down; comity across", "ess": "what binds", "prio": 1, "hook": "Vertical is obedience (the senior court says, the junior follows). Horizontal is manners: <b>comity</b>, a court honouring its own earlier bench.", "plain": "<b>Vertical</b> &rarr; <b>binding</b>. <b>Horizontal</b> &rarr; the doctrine of <b>comity</b> (within the same court): (i) <b>SB &rarr; SB</b>: binding; (ii) <b>DB &rarr; SB</b>: if the later bench does not want to follow, it goes to the Chief Justice; (iii) <b>Territorial jurisdiction</b>: one High Court&rsquo;s decision is <b>persuasive</b> on another, <b>binding</b> within its own territory; (iv) <b>Scenario</b>: a federal authority whose territorial jurisdiction is not notified: a cause of action against the Federation, if it affects you in Karachi, can be filed in Karachi.<br><br>Pakistan: a bench of equal strength cannot depart from an earlier bench; it must ask the Chief Justice for a larger bench (Tribune; The News). On territory, the Supreme Court has held that if relief relates to an act done within one High Court&rsquo;s territory, no other High Court can exercise writ jurisdiction on the ground of a federal party (Business Recorder, 2024).", "gap": "The question mark on the (ii) arrow, the letters on the two boxes in (iii) and the citation written beside it (2024 SCMR 1656) are not confirmed. Not cited.", "links": [{"l": "\u24b6 Conflicting decisions", "m": 6, "sec": "6.2"}, {"l": "Art. 201: High Court decisions", "m": 5, "sec": "201"}]}, {"code": "5.8", "term": "In rem and in personam", "sub": "Against the whole world, or against the parties", "hook": "A judgment <i>in rem</i> is a public notice; a judgment <i>in personam</i> is a letter to the parties.", "plain": "<b>In rem</b>: against the <b>whole world</b>; judgments that directly or indirectly affect the legal status of any object, thing or person, conclusive against everyone. <b>In personam</b>: against the parties (class example: civil courts). Checked: Art. 55 of the Qanun-e-Shahadat Order 1984 covers certain judgments in probate, matrimonial, admiralty and insolvency jurisdiction that confer or take away a legal character, which are the judgments in rem.", "gap": "The example written for in rem (&ldquo;Madfasi HC Musugarh&rdquo;) is unclear and not used.", "links": [{"l": "5.9", "m": 5, "sec": "5.9"}]}, {"code": "5.9", "term": "Three doctrines that bring a past judgment in", "sub": "Qanun-e-Shahadat 54\u201358, res judicata, double jeopardy", "ess": "precedent", "prio": 1, "hook": "Three bouncers at the door of a new case: one checks the old judgment, one checks the old suit, one checks the old trial.", "plain": "<b>&#9312; QSO Arts 54 to 58</b>: Art. 54 makes previous judgments relevant to bar a second suit or trial; Art. 55 covers the judgments in rem above; Arts 56 and 57 other judgments; Art. 58 lets fraud, collusion or incompetency of court be proved. <b>&#9313; Res judicata</b>, s.11 CPC. <b>&#9314; Double jeopardy</b>, s.403 CrPC: a person once convicted or acquitted is not to be tried for the same offence. <b>All three operate at the same time</b>; the <b>parties are bound</b>.", "gap": "&ldquo;2012 CLC 562 Lahore&rdquo; (the &ldquo;Asshad Ali case&rdquo;, noted for res judicata, all elements) was found only on a slide deck without party names, so it is not cited.", "links": []}], "spar": [{"q": "You rely on a Supreme Court decision before the FCC. Does it bind the FCC?", "a": "By the text of Art. 189(2) a Supreme Court decision binds all other courts except the FCC, so it does not bind the FCC. Note that the FCC has also said earlier Supreme Court rulings are persuasive, not binding, on it, and that the relationship is still contested in practice."}, {"q": "Two High Courts differ on a point and a district judge in Karachi must decide. Whose view does he follow?", "a": "His own High Court (Art. 201: High Court decisions bind courts subordinate to it; if two High Courts differ, a subordinate court follows its own). A decision of the other High Court is persuasive only. If an FCC or SC decision on the point exists, Art. 189 puts that first."}, {"q": "The teacher said even remarks of superior courts are binding. What would you say to a judge who says &ldquo;that is obiter, I am free to ignore it&rdquo;?", "a": "Obiter is generally not binding by itself, but Pakistani courts have said subordinate courts cannot ignore the obiter of the apex court. Say that the teacher&rsquo;s line is a best reading of cramped notes and that the Pakistani support comes from a press report, not a reported judgment."}], "boundary": "<b>Boundary map &middot; who binds whom (Arts 189 and 201)</b><br>Every pairing of the courts in the Constitution&rsquo;s chain, classified against the test &ldquo;does a decision of the row court bind the column court?&rdquo;<table class=\"btbl\"><tr><th>Decision of&nbsp;&darr; / binds&nbsp;&rarr;</th><th>FCC</th><th>Supreme Court</th><th>Courts subordinate to that High Court</th><th>Another High Court</th></tr><tr><td>FCC</td><td>same court: comity</td><td class=\"ok\">Binds (189(1))</td><td class=\"ok\">Binds (189(1))</td><td class=\"ok\">Binds (189(1))</td></tr><tr><td>Supreme Court</td><td class=\"no\">Does not bind (189(2))</td><td>same court: comity</td><td class=\"ok\">Binds (189(2))</td><td class=\"ok\">Binds (189(2))</td></tr><tr><td>A High Court</td><td class=\"no\">No</td><td class=\"no\">No</td><td class=\"ok\">Binds courts subordinate to that High Court (201)</td><td class=\"no\">Persuasive only (class: territorial point)</td></tr></table>Within one court (horizontal), the rule is comity and the Chief Justice route, not Arts 189 and 201. The FCC and SC relationship is contested in practice (see 189).", "recall": "<b class=\"hl\">Recall</b>Ratio binds, obiter floats. <b>189</b>: FCC over all; SC over all but the FCC. <b>201</b>: &ldquo;subject to 189&rdquo;, then the High Court over its own subordinate courts. Same court: comity, and the Chief Justice for a larger bench."}, "6": {"intro": "Binding precedent has three exceptions, drawn from <b>Young v Bristol Aeroplane</b> (1944): <b>conflicting decisions</b>, <b>conflict with the House of Lords</b> and <b>per incuriam</b>. Class added <b>sub silentio</b> as a close cousin. The gate below ties Arts 189 and 201 to these exceptions: does this authority bind <i>me</i>?", "rails": [{"code": "6.1", "term": "The three exceptions", "sub": "Young v Bristol Aeroplane (1944)", "ess": "exceptions", "prio": 1, "hook": "Even a binding precedent has a trapdoor: three of them, in fact.", "plain": "<b>&#9398; Conflicting decisions. &#9399; Conflict with the House of Lords. &#9400; Per incuriam.</b> <i>Young v Bristol Aeroplane Co Ltd</i> [1944] KB 718 (Court of Appeal, Lord Greene MR, 28 July 1944), affirmed by the House of Lords at [1946] AC 163. A worker had received compensation under the Workmen&rsquo;s Compensation Act and then claimed damages from his employer. It holds the Court of Appeal bound by its own decisions, subject to three exceptions: the same three the teacher listed.", "gap": "&ldquo;Conflict with the House of Lords&rdquo; is noted as &ldquo;251 of 2026 SCP&rdquo; and another reference joined by an arrow marked &ldquo;Not the same&rdquo;. What he compared is unclear, and whether Pakistani courts treat House of Lords decisions as binding was not verified. Not cited.", "links": [{"l": "\u24b6 Conflicting decisions", "m": 6, "sec": "6.2"}, {"l": "\u24b8 Per incuriam", "m": 6, "sec": "6.3"}, {"l": "Sub silentio", "m": 6, "sec": "6.4"}]}, {"code": "6.2", "term": "\u24b6 Conflicting decisions", "sub": "UK: the judge chooses; Pakistan: send to the Chief Justice", "ess": "exceptions", "prio": 1, "hook": "In London the judge picks a side. In Pakistan he sends for a bigger bench.", "plain": "When a court has two conflicting decisions before it (the bracket on the page: <b>X or Y</b>): <b>UK</b>: the judge can choose between X and Y. <b>Pakistan</b>: cannot choose; <b>send to the Chief Justice</b> to form a <b>larger bench</b>. Support: the Supreme Court has held that a bench of equal strength cannot depart from an earlier bench and must ask for a larger one (Tribune; The News, five-member bench); a Lahore High Court judge likewise referred a conflict to the chief justice (Dawn, 21 Aug 2025). The UK-judge-chooses point is the standard statement of the first exception; not checked word for word.", "links": [{"l": "5.7", "m": 5, "sec": "5.7"}]}, {"code": "6.3", "term": "\u24b8 Per incuriam", "sub": "A decision given through want of care", "ess": "exceptions", "prio": 1, "hook": "<i>Per incuriam</i>: &ldquo;through want of care&rdquo;. The court walked past a binding signpost and did not look up.", "plain": "<b>Meaning</b>: Latin for &ldquo;through want of care&rdquo;. <b>Rule</b>: a decision given in ignorance of law. <b>Effect</b>: the court refuses to follow it. <b>Conditions</b> as noted: the court <b>overlooked something</b> (a precedent); and, if the outcome of the case is reversed, it becomes per incuriam. <b>What counts as overlooked</b>: any <b>rule</b>, <b>constitutional article</b>, <b>special Act</b> and so on.<br><br>Lord Greene&rsquo;s illustration was ignorance of a relevant statute or rule of court. In Pakistan the Supreme Court&rsquo;s test has been a conflicting judgment of a larger bench, or ignorance of a constitutional provision (The News). A decision is not per incuriam merely because the parties were deficient or the court lacked the best arguments; only the court itself can declare a Supreme Court judgment per incuriam, not a lower court (Minute Mirror).", "wc": {"w": "&ldquo;The Supreme Court got it wrong, so that judgment is per incuriam and I need not follow it.&rdquo;", "r": "&ldquo;A decision is per incuriam only if it overlooked something that binds, such as a statute, a constitutional provision or a binding precedent; being wrong is not enough, and a lower court cannot declare it.&rdquo;"}, "gap": "Condition 2 (&ldquo;if the outcome gets reversed&rdquo;) is hard to read and no source found says a decision becomes per incuriam only after it is reversed. The teacher&rsquo;s Limitation Act example (a 30-day period counted from the order, not the judgment) names no section or case.", "links": [{"l": "Per incuriam against sub silentio", "m": 6, "sec": "6.5"}]}, {"code": "6.4", "term": "Sub silentio", "sub": "A point not perceived by the court", "ess": "exceptions", "prio": 1, "hook": "<i>Sub silentio</i>: &ldquo;under silence&rdquo;. The point was in the room, but no one noticed it.", "plain": "<b>When</b>: any point was not considered or perceived by the court. <b>Teacher&rsquo;s example</b>: whether s.302 or s.315 applied was not checked; however, the conviction was a binding precedent.<br><br>Origin in English law: <i>Lancaster Motor Co (London) Ltd v Bremith Ltd</i> [1941] 1 KB 675 (Court of Appeal, Greene MR). A decision passes sub silentio when the particular point of law was not perceived by the court or present to its mind; the decision is then not an authority on that point even though the point was involved in the facts. A Sindh High Court judgment treats a later bench as free to depart if the earlier judgment is shown to be per incuriam or sub silentio.", "gap": "The Act in the s.302 or s.315 example is not named (read as the Pakistan Penal Code), and which case was used is not noted.", "links": [{"l": "Per incuriam against sub silentio", "m": 6, "sec": "6.5"}]}, {"code": "6.5", "term": "Per incuriam against sub silentio", "sub": "The difference in one table", "ess": "exceptions", "prio": 1, "hook": "Per incuriam: the court <i>overlooked the rule</i>. Sub silentio: the court <i>never took up the question</i>.", "plain": "<table class=\"btbl\"><tr><th></th><th>Per incuriam</th><th>Sub silentio</th></tr><tr><td>Meaning</td><td>A decision passed in ignorance of a binding statute or anything with binding force, including previous precedents</td><td>A point not perceived or argued before the court</td></tr><tr><td>Test</td><td>Was something controlling overlooked?</td><td>Was the issue or question of law considered by the court?</td></tr><tr><td>Effect (teacher)</td><td>The decision loses binding authority</td><td>No authority at all: neither binding nor persuasive</td></tr></table>", "gap": "Contested: &ldquo;neither binding nor persuasive&rdquo; is the teacher&rsquo;s position and a best reading of a cramped line. Legal Service India says such rulings can still carry persuasive weight; Bar &amp; Bench (Arvind Datar) says only that they have no binding effect. Treat &ldquo;not persuasive either&rdquo; as the teacher&rsquo;s position, not settled.", "links": []}], "spar": [{"q": "Two Supreme Court decisions of equal strength conflict on a point. May the High Court choose the one it prefers?", "a": "No. In Pakistan the court cannot choose; it sends the matter to the Chief Justice for a larger bench (class; Tribune; The News). The UK judge-chooses rule is the English position, not Pakistan&rsquo;s."}, {"q": "You find a Supreme Court judgment that ignores a section of a statute directly on point. Can you call it per incuriam in your lower-court submission?", "a": "Argue the point but know the limit: per incuriam fits a decision given in ignorance of a binding statute, but only the court itself can declare a Supreme Court judgment per incuriam, not a lower court (Minute Mirror). So you cite the statute, ask the court to refer the point, and do not simply disregard the judgment."}, {"q": "What is the difference between per incuriam and sub silentio, and what does the teacher say about the effect of each?", "a": "Per incuriam: something controlling was overlooked; the decision loses binding authority. Sub silentio: a point was never perceived or argued; the decision is no authority on that point, and the teacher says neither binding nor persuasive, which other sources dispute. Flag that last point as contested."}], "boundary": "<b>Boundary map &middot; what counts as &ldquo;overlooked&rdquo; for per incuriam</b><br>Every category class and the sources named, classified against the test &ldquo;did the court overlook something controlling?&rdquo;<table class=\"btbl\"><tr><th>Thing overlooked</th><th>Per incuriam?</th><th>Source</th></tr><tr><td>A statute or rule of court</td><td class=\"ok\">Yes</td><td>Lord Greene&rsquo;s illustration</td></tr><tr><td>A constitutional article</td><td class=\"ok\">Yes</td><td>Class; The News (Supreme Court test)</td></tr><tr><td>A special Act</td><td class=\"ok\">Yes</td><td>Class</td></tr><tr><td>A binding precedent</td><td class=\"ok\">Yes</td><td>Class</td></tr><tr><td>A conflicting judgment of a larger bench</td><td class=\"ok\">Yes</td><td>The News (Supreme Court test)</td></tr><tr><td>A point never argued or perceived</td><td class=\"no\">No: that is sub silentio</td><td>Class</td></tr><tr><td>Weak arguments by the parties; the court simply got it wrong</td><td class=\"no\">No</td><td>Minute Mirror</td></tr></table>", "recall": "<b class=\"hl\">Recall</b>Three exceptions: <b>conflict, House of Lords, per incuriam</b>; sub silentio is the cousin. Conflict &rarr; <b>Chief Justice, larger bench</b>. Per incuriam &rarr; <b>overlooked a binding rule</b>. Sub silentio &rarr; <b>point never perceived</b>. Only the court itself can say per incuriam of its own apex judgment.", "gate": {"title": "Gate \u00b7 does it bind me?", "start": "s1", "steps": {"s1": {"q": "Is the passage a decision on a question of law (the ratio), not a fact finding or a passing remark?", "law": "Arts 189 and 201 bind only to the extent a decision decides a question of law or enunciates a principle of law.", "hint": "Look at the deliberation: is this the reason for the order?", "yes": "s2", "no": {"end": "Obiter. Not binding by itself, but a subordinate court cannot simply ignore an apex-court obiter (The News). Treat it as persuasive and strong.", "tone": "warn"}}, "s2": {"q": "Is it a decision of the Federal Constitutional Court?", "law": "Art. 189(1): binds all other courts in Pakistan, including the Supreme Court.", "hint": "Check the court named in the citation.", "yes": "s6", "no": "s3"}, "s3": {"q": "Is it a decision of the Supreme Court?", "law": "Art. 189(2): binds all other courts except the FCC.", "hint": "If you are arguing before the FCC, this changes the answer.", "yes": "s4", "no": "s5"}, "s4": {"q": "Are you arguing before the Federal Constitutional Court?", "law": "Art. 189(2): the Supreme Court\u2019s decision does not bind the FCC.", "hint": "Contested in practice: see Module 5.", "yes": {"end": "It does not bind the FCC under the text of Art. 189(2); the FCC has treated earlier Supreme Court rulings as persuasive. Contested in practice.", "tone": "warn"}, "no": "s6"}, "s5": {"q": "Is it a decision of the High Court that your court is subordinate to?", "law": "Art. 201: a High Court decision binds all courts subordinate to it, subject to Art. 189.", "hint": "A different High Court\u2019s decision is persuasive only.", "yes": "s6b", "no": {"end": "Persuasive only (for example another High Court\u2019s decision). A subordinate court follows its own High Court if two differ.", "tone": "warn"}}, "s6": {"q": "Is there a conflicting decision of equal strength on the same point, or was the decision given in ignorance of a binding rule or authority (per incuriam)?", "law": "Exceptions from Young v Bristol Aeroplane: conflicting decisions, conflict with the House of Lords, per incuriam. Sub silentio is the cousin.", "hint": "Only the court itself can declare a Supreme Court judgment per incuriam, not a lower court.", "yes": {"end": "Its binding force is in doubt. Conflicting decisions of equal benches go to the Chief Justice for a larger bench; per incuriam applies only where something controlling was overlooked. A lower court cannot declare an apex-court judgment per incuriam.", "tone": "warn"}, "no": {"end": "It binds (Arts 189 and 201). Cite it with its court and citation and apply the ratio.", "tone": "ok"}}, "s6b": {"q": "Has the High Court\u2019s decision been overtaken by a conflicting decision, or is it per incuriam or sub silentio?", "law": "Same exceptions as s6. A Sindh High Court judgment treats a later bench as free to depart if the earlier judgment is per incuriam or sub silentio.", "hint": "Check the later bench and the Supreme Court first.", "yes": {"end": "Its binding force is in doubt. Refer a conflict to the Chief Justice for a larger bench; do not choose between conflicting decisions yourself.", "tone": "warn"}, "no": {"end": "It binds all courts subordinate to that High Court (Art. 201).", "tone": "ok"}}}}}, "7": {"intro": "This module is my addition, not a class lecture: a last check to run before a case, section or Article goes into a note, a research memo or an argument. It uses only what Modules 1 to 6 taught, plus one rule the whole app follows: <b>do not cite what you could not read</b>.", "rails": [{"code": "7.1", "term": "Read the text, not the summary", "sub": "A headnote is not the judgment", "ess": "cite", "prio": 1, "hook": "A summary is a menu; the section is the meal. Never order for a client from the menu alone.", "plain": "Every citation in this app comes from one of three places: the <b>bare text</b> of an Act or the Constitution that was actually read; a <b>reported judgment</b> that was read; or a <b>secondary note</b> (a headnote, a news report, a blog). Anything from the third kind is marked as such, for example <i>Mushtaq Ahmad</i> and <i>PLD 2016 SC 769</i> in Module 3, which were read as headnotes or on unofficial sites. Treat those as leads, not as the authority itself.", "links": []}, {"code": "7.2", "term": "Reading a Pakistani citation", "sub": "Year, report, court, page", "tag": "Standard gloss", "hook": "A citation is an address: year, building, floor, door.", "plain": "In <b>PLD 2016 SC 769</b> the year is 2016, <b>PLD</b> is the report (Pakistan Legal Decisions), <b>SC</b> is the court and <b>769</b> the page. In <b>1991 SCMR 543</b> the report is the Supreme Court Monthly Review. Other common reports you will meet: <b>CLC</b> (Civil Law Cases), <b>YLR</b> (Yearly Law Reports) and <b>PCrLJ</b> (Pakistan Criminal Law Journal). This is a standard gloss of mine, not from class; check the report&rsquo;s own title page for its exact name.", "gap": "Not covered in class: how the teacher wants cases cited in written work. Ask before using a house style.", "links": []}, {"code": "7.3", "term": "Is it still good law?", "sub": "Currency of the Constitution and of the case", "ess": "cite", "prio": 1, "hook": "Law has a use-by date, and the 27th Amendment moved it for several Articles.", "plain": "The Constitution text used here is the 14th edition as amended up to the <b>Twenty-seventh Amendment</b> (Government of Pakistan, Ministry of Law and Justice, Nov 2025). The 27th Amendment inserted the Federal Constitutional Court (Arts 175B to 175L) and its appeal route (175F), and Art. 185 now reads &ldquo;subject to Article 175F&rdquo;. Older cases that speak of the Supreme Court in these roles may need reading with that in mind. The relationship of the FCC and the Supreme Court is itself contested (see Module 5, Art. 189).", "links": [{"l": "189", "m": 5, "sec": "189"}, {"l": "175E", "m": 4, "sec": "175E"}]}, {"code": "7.4", "term": "The unread-gap rule", "sub": "If you could not confirm it, do not cite it", "ess": "cite", "prio": 1, "hook": "An honest gap in a note costs a footnote. A false citation can cost a client.", "plain": "The rule used in this app: a case or figure that could not be read from a reliable source stays out of the app and goes on a pending list. Examples left out here: the case behind &ldquo;2012 CLC 562&rdquo;, &ldquo;2024 SCMR 1656&rdquo; and &ldquo;251 of 2026 SCP&rdquo;; the NAB example; the Limitation Act example; the 20-day period for an intra-court appeal; and the death-punishable bail figures. Carry the same habit into your own work: leave out what you could not read, say so, and come back to it.", "gap": "These items were written in class or found in passing, but could not be read at the source. They are pending, not wrong.", "links": []}], "spar": [{"q": "You find a useful headnote on a Supreme Court case but cannot open the judgment. Do you cite it?", "a": "Not as the authority. A headnote is a lead. Cite it only if you also read the judgment; otherwise mention the point as a lead and flag it, or leave it out. This is the unread-gap rule."}, {"q": "An older judgment says the Supreme Court has jurisdiction in a Fundamental Rights matter of public importance. What do you check before relying on it?", "a": "Currency: after the 27th Amendment, Art. 175E(3) gives the Federal Constitutional Court power to make an Art. 199-type order on such a question, on an application filed in that Court. Read the current text and see whether the old judgment still describes the right forum."}, {"q": "Tick-box test: your checklist has nine boxes and you can honestly tick seven. What do you do with the other two?", "a": "Do not cite until both are resolved, or cite only what is read and mark the rest as a gap in your note. Seven of nine is a draft, not a citation."}], "recall": "<b class=\"hl\">Recall</b>Question, source order, text, currency, level, exceptions, forum, citation, gap. If any box is empty, the authority is not ready to cite.", "check": {"h": "Before-you-cite checklist \u00b7 tick as you go", "intro": "Run this for every authority you are about to rely on. Ticks are saved on this device.", "items": ["Question: which of the four questions does this authority answer (rights, law, procedure, forum)?", "Source order: is it a statute, a rule under a statute, a precedent or a doctrine, and did I read the statute first?", "Text: have I read the actual words of the section or Article (the bare text), not only a summary or a headnote?", "Currency: is the text current with amendments? (The Constitution text in this app is as amended to the 27th Amendment.)", "Level: does this court bind mine under Arts 189 and 201, or is it persuasive only?", "Exceptions: was it per incuriam, sub silentio or in conflict with another decision of equal strength?", "Forum: is this the right court for the relief I want (Art. 175(2), 199, 212, 175F, 185)?", "Citation: do I have the full citation (year, report, court, page) and did I read the judgment itself, not only a note on it?", "Gap: if I could not read or confirm it, did I leave it out and say so?"]}}, "8": {"intro": "From the Fri 27 Nov class: what to do when the Act gives <b>no definition</b>, how to decide <b>which definition to borrow</b>, which law <b>wins when two clash</b> (<b>notwithstanding</b>, <b>subject to</b>, <b>not in derogation</b>), and what the operative words <b>shall, may, or, and</b> do. The gate below walks the meaning of a word; the boundary table sorts every operative word met in class.", "rails": [{"code": "8.1", "term": "No definition: the dictionary meaning", "sub": "Ordinary meaning, but not against what the law intended", "ess": "the method", "prio": 1, "hook": "No fence built by the Act? Reach for the dictionary, then check it against what the law was for.", "plain": "<b>Teacher&rsquo;s question:</b> how to find the meaning if a definition does not exist? <b>Rule noted:</b> take the <b>ordinary dictionary meaning</b>, but <b>not one contrary to what the law intended</b>. <b>Example:</b> &ldquo;<b>unwelcome</b>&rdquo; in &ldquo;unwelcome sexual advances&rdquo; in the sexual harassment law; noted as &ldquo;not objected to / not objectionable&rdquo; and &ldquo;silence is implied as a consent&rdquo; (my readings of cramped lines). <b>Authority written down:</b> Justice Ijaz ul Haq, @ 2006 SCMR (&ldquo;ordinary dictionary meaning&rdquo;).<br><br>Checked: the Prevention of Corruption Act 1947 (Pakistan text), s.2 says &ldquo;public servant&rdquo; means a public servant as defined in s.21 of the Penal Code, and includes an employee of a body set up, controlled or administered under the authority of the Federal Government. The Workplace Harassment Act 2010 defines harassment in s.2(h) with phrases such as &ldquo;unwelcome sexual advance&rdquo; (Dawn report). The limit of the dictionary: in <i>Nadia Naz</i> (2021) the Supreme Court held harassment under that Act is limited to conduct of a sexual nature; review petitions argued the dictionary gives &ldquo;sexual&rdquo; a wider meaning (Supreme Court review petitions 255 and 570 of 2021).", "wc": {"w": "&ldquo;Section 5 does not define &lsquo;public servant&rsquo;, so the Act has no definition.&rdquo;", "r": "&ldquo;Section 5 does not define it; check the Act&rsquo;s interpretation section and any law it points to, then the ordinary meaning.&rdquo;"}, "gap": "The notes say the Prevention of Corruption Act has no definition clauses; the text found has s.2. The 2006 SCMR judgment was not found, and the 2010 Act post-dates 2006, so that case cannot be about the Act&rsquo;s own definition. Ask the teacher for the case name and which Act he meant.", "links": [{"l": "Pari materia: the two-part test", "m": 8, "sec": "8.2"}, {"l": "Definitions: section 2", "m": 3, "sec": "3.5"}, {"l": "3.7", "m": 3, "sec": "3.7"}]}, {"code": "8.2", "term": "Pari materia: the two-part test", "sub": "Same subject, same purpose", "ess": "borrowing a definition", "prio": 1, "hook": "Borrow a definition only from a sister: same people, same sense, same work.", "plain": "When a word is defined in <b>another statute</b>, the teacher asks: <b>which definition to choose</b>, the dictionary meaning or the other law&rsquo;s definition. The doctrine of <b><i>pari materia</i></b> (&ldquo;on the same subject&rdquo;) answers it.<table class=\"btbl\"><tr><th>Condition</th><th>Question</th><th>As noted</th></tr><tr><td>&#9312; Same subject</td><td>What meaning?</td><td>Both statutes deal with the same people and use the key word in the same sense</td></tr><tr><td>&#9313; Same purpose</td><td>What purpose?</td><td>Both laws were made to do the same kind of work</td></tr></table><b>TEST: same subject, same purpose. Use <i>pari materia</i> only if both conditions are met.</b> If met, use the meaning that is relevant. <b>Limit:</b> family laws cannot borrow from the Customs Act.<br><br><b>Examples in the notes:</b> the Child Pledging of Labour Act; the Employees Compensation Act 1923 (accidents and injuries in the &ldquo;course of employment&rdquo;) set beside the Employees State Insurance Act; an Indian Supreme Court judgment, 2025 INSC 904, boxed as the precedent. Checked: a Law and Justice Commission paper calls the Children (Pledging of Labour) Act 1933 and the Employment of Children Act 1991 &ldquo;in pari materia&rdquo;.", "wc": {"w": "&ldquo;Both Acts mention a child, so the definition in one governs the other.&rdquo;", "r": "&ldquo;Same subject and same purpose: only if both are met can the other Act&rsquo;s meaning be used.&rdquo;"}, "gap": "The notes do not say what question each example answers. The case behind 2025 INSC 904 and &ldquo;Soba Khan 2016&rdquo; were not identified, and the 2025 INSC 904 reference was not found. &ldquo;Sec 51(E)&rdquo; of the Employees State Insurance law was not checked. No Pakistani authority was read for the test itself.", "links": [{"l": "3.7", "m": 3, "sec": "3.7"}, {"l": "8.1", "m": 8, "sec": "8.1"}]}, {"code": "8.3", "term": "Notwithstanding, subject to, not in derogation", "sub": "Words that tell you which law wins or that both apply", "ess": "which law wins", "prio": 1, "hook": "&ldquo;Notwithstanding&rdquo; pushes past; &ldquo;subject to&rdquo; steps aside; &ldquo;not in derogation&rdquo; sits beside.", "plain": "<table class=\"btbl\"><tr><th>Words</th><th>As noted</th></tr><tr><td>&ldquo;Notwithstanding&hellip;&rdquo; (non obstante, written &ldquo;not with standing&rdquo;)</td><td>This law will prevail over every other law. Example: s.6 JJSA.</td></tr><tr><td>&ldquo;Subject to&hellip;&rdquo;</td><td>&ldquo;Will have an overriding effect wherever it is mentioned.&rdquo; Example: s.5(1) MFLO 1961, jurisdiction; where the MFLO conflicts with any other Act, the MFLO will not prevail (as written).</td></tr><tr><td>&ldquo;In addition to, not in derogation of&hellip;&rdquo;; &ldquo;Nothing in this&hellip;&rdquo;</td><td>Both Acts shall be read together.</td></tr></table>Checked in the attached texts: MFLO s.3 says its provisions &ldquo;shall have effect notwithstanding any law, custom or usage&rdquo;. Family Courts Act s.5(1) begins &ldquo;Subject to the provisions of the Muslim Family Laws Ordinance, 1961&rdquo;, s.5(2) begins &ldquo;Notwithstanding anything contained in the Code of Criminal Procedure, 1898&rdquo;, and s.21 says nothing in the Act affects the MFLO. The JJSA s.6(1) begins &ldquo;Notwithstanding anything contained in the Code&rdquo;, and the Act has a section 23, &ldquo;Act to override other laws&rdquo;. A commentary on Indian law says a &ldquo;subject to&rdquo; clause makes the provision yield to the one named, while a non obstante clause gives it superior effect.", "gap": "The &ldquo;subject to&rdquo; line and its example do not agree: the note says it overrides, yet the MFLO is said not to prevail, and the Family Courts Act (not the MFLO) is where &ldquo;subject to&rdquo; appears in s.5(1). The Indian commentary says a &ldquo;subject to&rdquo; clause yields. Ask the teacher which way he meant; do not rely on the note.", "links": [{"l": "8.4", "m": 8, "sec": "8.4"}]}, {"code": "8.4", "term": "Which law wins: JJSA, CrPC and CNSA", "sub": "Special over general; substantive over procedural", "ess": "which law wins", "prio": 1, "hook": "The special Act is the specialist surgeon: when it speaks, the general code steps aside.", "plain": "<b>Class points:</b> Sec 6 JJSA overrides the CrPC and grants bail to a juvenile offender: a <b>special Act is overpowering</b>. &#9733; <b>Substantive law overrides procedural law.</b> <b>CrPC s.5</b>: any other law is dealt with under the Code <b>unless the special law defines a separate procedure</b>. <b>Example:</b> a 15-year-old with hashish; the JJSA applies and the CNSA also applies. The CNSA bars bail for a death-penalty offence; the JJSA gives bail even for heinous offences after six months of trial. <b>CNSA 1997 against JJSA 2018: the JJSA will prevail</b> (the later enacted law, if none of &ldquo;the 3 conditions&rdquo; is cleared).<br><br>Checked: CrPC s.5(2) says offences under other laws are dealt with under the Code but subject to any enactment regulating the manner or place of investigating, inquiring or trying them. CNSA s.51(1): bail shall not be granted where the offence is punishable with death (headnote extracts of Supreme Court cases). JJSA s.6(5): a juvenile detained for a continuous period over six months whose trial is not complete shall be released on bail (Sindh High Court judgments quoting the section); s.6(4) lets bail be refused to a juvenile over 16 charged with a heinous offence (Dawn).", "wc": {"w": "&ldquo;The CNSA is the special law, so a juvenile accused under it can never get bail.&rdquo;", "r": "&ldquo;Both Acts apply. CNSA s.51(1) bars bail where the offence is punishable with death, but JJSA s.6 gives a juvenile its own bail rules; the class position is that the later JJSA prevails. Check the case law before relying on it.&rdquo;"}, "gap": "&ldquo;The 3 conditions&rdquo; and the judgment said to grant JJSA bail are not named, and the section numbers (&ldquo;S11&rdquo;, &ldquo;S40 something&rdquo;) are unclear. No Pakistani judgment on a JJSA and CNSA clash was read; PLD 2022 SC 551 is said, on a blog, to hold that s.6(5) applies to heinous offences whatever the age. Not read at the court site.", "links": [{"l": "8.3", "m": 8, "sec": "8.3"}]}, {"code": "8.5", "term": "\u201cShall\u201d and \u201cmay\u201d", "sub": "Mandatory or discretionary", "ess": "operative words", "prio": 1, "hook": "&ldquo;Shall&rdquo; is a command; &ldquo;may&rdquo; is permission.", "plain": "<table class=\"btbl\"><tr><th>Word</th><th>As noted</th></tr><tr><td>&ldquo;Shall&rdquo;</td><td>Mandatory, compulsory, with penal consequences. Example: CrPC s.154 &ldquo;shall be&rdquo;.</td></tr><tr><td>&ldquo;May&rdquo;</td><td>Discretionary. Example: CrPC s.161 &ldquo;may examine&rdquo; orally; the note adds that if the officer does examine, he has to put it in writing.</td></tr><tr><td>&ldquo;Shall&rdquo; in a civil law</td><td>Still discretionary unless there are penal consequences.</td></tr></table>Checked: the Pakistani text of CrPC s.161(3) says the police officer <b>may</b> reduce into writing any statement made to him, and if he does so he shall make a separate record of each person&rsquo;s statement. CrPC s.154 says information about a cognizable offence given orally &ldquo;shall be reduced to writing&rdquo; (unofficial site).", "wc": {"w": "&ldquo;The section says shall, so it is always mandatory.&rdquo;", "r": "&ldquo;In criminal provisions with penal consequences, shall is mandatory (class: CrPC s.154); in civil provisions it can still be discretionary unless penal consequences follow.&rdquo;"}, "gap": "The note &ldquo;if may examine, will have to put it in writing&rdquo; does not match s.161(3), which also says &ldquo;may&rdquo;. No Pakistani judgment on mandatory against directory &ldquo;shall&rdquo; was read. Ask the teacher what he meant.", "links": [{"l": "\u201cOr\u201d and \u201cand\u201d", "m": 8, "sec": "8.6"}]}, {"code": "8.6", "term": "\u201cOr\u201d and \u201cand\u201d", "sub": "Disjunctive and conjunctive", "ess": "operative words", "prio": 1, "hook": "&ldquo;Or&rdquo; hands the judge a menu; &ldquo;and&rdquo; hands him a to-do list.", "plain": "<table class=\"btbl\"><tr><th>Disjunctive &ldquo;OR&rdquo;</th><th>Conjunctive &ldquo;AND&rdquo;</th></tr><tr><td>The judge can choose either</td><td>The judge must award both</td></tr></table><b>Example:</b> PPC 489-F, &ldquo;or&rdquo;. Checked: s.489-F provides imprisonment which may extend to three years, <b>or with fine, or with both</b> (Sindh High Court judgments quoting the section). It is a three-way choice for the judge.", "links": [{"l": "\u201cShall\u201d and \u201cmay\u201d", "m": 8, "sec": "8.5"}]}], "spar": [{"q": "Section 5 of an Act names &ldquo;public servant&rdquo; but does not define it. What do you do before reaching for a dictionary?", "a": "Read the whole Act, especially its interpretation section, and any law it points to. Checked example: the Prevention of Corruption Act 1947, s.2, defines &ldquo;public servant&rdquo; by pointing to s.21 of the Penal Code. Only if nothing defines the word do you take the ordinary meaning, tested against the law&rsquo;s intent."}, {"q": "A word is defined in another Act. State the two conditions for borrowing it, and say why a family-law question cannot borrow from the Customs Act.", "a": "Same subject (same people, key word in the same sense) and same purpose (both laws made to do the same kind of work); both must be met. The Customs Act and a family law deal with different people and do different work, so neither condition is met."}, {"q": "A 15-year-old is charged under the CNSA. Which Act governs bail, and what is unresolved in the class notes?", "a": "Both apply in the notes: the CNSA bars bail where the offence is punishable with death, and the JJSA gives its own bail rules, including s.6(5) after six months. The class position is that the JJSA, the later Act, prevails. Unresolved: the teacher&rsquo;s &ldquo;3 conditions&rdquo;, the case, and the section numbers; no Pakistani judgment on the clash was read."}, {"q": "A section says a court &ldquo;may&rdquo; do something. A party says it must. How does the class rule help, and where does it not?", "a": "&ldquo;May&rdquo; is discretionary; &ldquo;shall&rdquo; is mandatory where penal consequences follow, and in civil law &ldquo;shall&rdquo; can still be discretionary. So the party needs more than the verb. The class note that a &ldquo;may&rdquo; examination must then be written down does not match CrPC s.161(3), which also says &ldquo;may&rdquo;; do not rely on it."}], "boundary": "<b>Boundary map &middot; operative words</b><br>Every operative word the class met, classified by effect:<table class=\"btbl\"><tr><th>Word</th><th>Effect</th><th>Where seen</th></tr><tr><td>notwithstanding (non obstante)</td><td class=\"ok\">This law prevails</td><td>s.6 JJSA; MFLO s.3</td></tr><tr><td>subject to</td><td class=\"no\">Class note unclear; sources say the provision yields</td><td>FCA s.5(1)</td></tr><tr><td>in addition to, not in derogation of</td><td class=\"ok\">Both Acts read together</td><td>Class</td></tr><tr><td>nothing in this&hellip;</td><td>Listed in class; effect not noted</td><td>FCA s.21</td></tr><tr><td>shall</td><td class=\"ok\">Mandatory, with penal consequences</td><td>CrPC s.154</td></tr><tr><td>shall (civil law)</td><td class=\"no\">Discretionary unless penal consequences</td><td>Class</td></tr><tr><td>may</td><td class=\"no\">Discretionary</td><td>CrPC s.161</td></tr><tr><td>or</td><td class=\"ok\">Judge chooses either</td><td>PPC 489-F</td></tr><tr><td>and</td><td class=\"ok\">Judge must award both</td><td>Class</td></tr></table>", "recall": "<b class=\"hl\">Recall</b>No definition? <b>Check the Act, then a sister Act (same subject and same purpose), then the ordinary meaning</b> tested against the law&rsquo;s intent. <b>Notwithstanding</b> wins; <b>not in derogation</b> means read together. <b>Shall</b> commands (with a penalty), <b>may</b> permits; <b>or</b> lets the judge choose, <b>and</b> makes him award both.", "gate": {"title": "Gate \u00b7 which meaning of a word?", "start": "s1", "steps": {"s1": {"q": "Does the Act itself define the word, in its definitions section or by pointing to another law?", "law": "Class: look first at the Act. Checked example: the Prevention of Corruption Act 1947, s.2, defines \u201cpublic servant\u201d by pointing to s.21 of the Penal Code.", "hint": "Section 5 not defining a term is not the same as the Act not defining it. Read the interpretation section and the whole Act.", "yes": {"end": "Use the Act\u2019s definition. Then read its verb with the Module 3 gate: \u201cmeans\u201d is exhaustive, \u201cincludes\u201d is not.", "tone": "ok"}, "no": "s2"}, "s2": {"q": "Does another statute define the word?", "law": "Class question: which definition to choose, the dictionary meaning or the definition in another law (the PPC in the notes).", "hint": "Think of a sister Act on the same subject.", "yes": "s3", "no": {"end": "Take the ordinary dictionary meaning, but not one that is contrary to what the law intended (class, Fri 27 Nov).", "tone": "ok"}}, "s3": {"q": "Do both statutes deal with the same people and use the key word in the same sense?", "law": "Condition 1 of the pari materia test: same subject, asked as \u201cwhat meaning?\u201d.", "hint": "Class limit: family laws cannot borrow from the Customs Act.", "yes": "s4", "no": {"end": "Do not borrow. Pari materia needs both conditions; fall back to the ordinary dictionary meaning, tested against the purpose of your Act.", "tone": "warn"}}, "s4": {"q": "Were both laws made to do the same kind of work?", "law": "Condition 2 of the pari materia test: same purpose, asked as \u201cwhat purpose?\u201d.", "hint": "Compare the preambles (Module 3).", "yes": {"end": "Use pari materia: read the two together and take the relevant meaning. Both conditions are met: same subject, same purpose.", "tone": "ok"}, "no": {"end": "Do not borrow. Only one condition is met, and the teacher\u2019s rule is both. Use the ordinary dictionary meaning, tested against your Act\u2019s purpose.", "tone": "warn"}}}}}};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function stripTags(s){return String(s).replace(/<[^>]+>/g,' ')}
function mod(n){return MODS.filter(function(m){return m.n==n})[0]}
function arcOf(m){return CFG.arcs.filter(function(a){return a.id==m.p})[0]}
function railBlob(r){var b=r.code+' '+r.term+' '+r.sub+' '+(r.hook||'')+' '+stripTags(r.plain||'')+' '+(r.tag||'');
 if(r.src)b+=' '+r.src.paras.map(function(p){return p.t}).join(' ');
 if(r.gap)b+=' '+r.gap;
 return b.toLowerCase()}
function searchBlob(m){var b=(m.t+' '+m.s+' '+m.h);var d=MD[m.n];if(d)b+=' '+d.rails.map(railBlob).join(' ');return b.toLowerCase()}
function matchLine(m,q){var d=MD[m.n];if(!d||!q)return '';var hit=[];d.rails.forEach(function(r){if(railBlob(r).indexOf(q)>-1)hit.push(r.code)});if(!hit.length)return '';return '<div class="module-match">Matches in '+hit.slice(0,8).join(', ')+(hit.length>8?' +'+(hit.length-8)+' more':'')+'</div>'}
function card(m,q){
 return '<div class="module-card" style="--c:'+m.c+'" data-act="open" data-n="'+m.n+'"><div class="module-top"><span class="module-section-tag">'+esc(m.s)+'</span><span class="module-chevron">&rsaquo;</span></div><div class="module-title">'+m.n+'. '+esc(m.t)+'</div><div class="module-hint">'+esc(m.h)+'</div>'+matchLine(m,q)+'<span class="module-pill">Ready &middot; '+MD[m.n].rails.length+' sections</span></div>';
}
function homeList(q){
 var h='',n=0;
 CFG.arcs.forEach(function(pt){
  var items=MODS.filter(function(m){return m.p==pt.id&&(!q||searchBlob(m).indexOf(q)>-1)});
  if(!pt.soon&&!items.length)return;
  n+=items.length;
  h+='<div class="section-label '+(pt.cls||'')+'" id="p'+pt.id+'">'+pt.l+'</div><div class="section-sub">'+pt.sub+'</div>';
  if(pt.soon){if(!q)h+='<div class="soon"><b>'+esc(pt.soonTitle)+'</b>'+pt.soon+'</div>';n++;}
  else h+=items.map(function(m){return card(m,q)}).join('');
 });
 return n?h:'<div class="no-match">No module matches that search.</div>';
}

 '<div class="search-wrap"><input class="search" id="homeSearch" placeholder="'+esc(CFG.searchPh)+'" autocomplete="off"></div>'+
 '<div id="sparHome">'+sparToggle()+'</div>'+
 '<div class="eq"><b>'+esc(CFG.eq.t)+'</b><div class="f">'+CFG.eq.f+'</div><div style="font-size:var(--fs-xs);color:#C8C8C8;margin-top:4px">'+CFG.eq.n+'</div></div>'+
 '<div class="arc-row">'+CFG.arcs.map(function(a){return '<div class="arc-card"><div class="arc-icon">'+a.icon+'</div><div class="arc-title">'+esc(a.title)+'</div><div class="arc-body">'+a.body+'</div></div>'}).join('')+'</div>'+
 '<div class="jump">'+CFG.arcs.map(function(a){return '<a'+(a.cls?' class="g"':'')+' data-act="jump" data-id="p'+a.id+'">'+a.j+'</a>'}).join('')+'</div>'+
 '<div id="homeList">'+homeList('')+'</div>'+fontBar();
}
function linkHTML(r){
 if(!r.links||!r.links.length)return '';
 return '<div class="xrow">'+r.links.map(function(l){return '<span class="xlink'+(mod(l.m).p>1?' part2':'')+'" data-act="open" data-n="'+l.m+'" data-sec="'+esc(l.sec)+'">&#10231; '+esc(l.l)+'</span>'}).join('')+'</div>';
}
function railHTML(m,r){
 var o=S.open[m]===r.code;var body='';
 if(o){
  var box='';
  var extra=(r.wc?'<div class="wc"><div class="w"><b>Do not write</b>'+r.wc.w+'</div><div class="r"><b>Write instead</b>'+r.wc.r+'</div></div>':'')+(r.gap?'<div class="gap"><b>Not settled in class</b>'+r.gap+'</div>':'');
  if(r.src){
   box='<div class="pos"><div class="pos-h">'+esc(r.src.h)+'</div><div class="pos-b">'+r.src.paras.map(function(p){return '<div class="pos-t'+(p.l?' sub':'')+'">'+esc(p.t)+'</div>'}).join('')+(r.plain?'<div class="plain"><b class="l">In plain words</b>'+r.plain+'</div>':'')+extra+linkHTML(r)+(r.src.f?'<div class="src">'+esc(r.src.f)+'</div>':'')+'</div></div>';
  }else{
   box='<div class="pos"><div class="pos-h">'+esc(r.oh||'From class')+'</div><div class="pos-b"><div class="plain" style="margin-top:0"><b class="l">In plain words</b>'+r.plain+'</div>'+extra+linkHTML(r)+'</div></div>';
  }
  body='<div class="rail-body">'+(r.hook?'<div class="hook"><b class="hl">Hook</b>'+r.hook+'</div>':'')+box+'</div>';
 }
 return '<div class="rail'+(r.ess?' priority':'')+(o?' expanded':'')+'" data-code="'+esc(r.code)+'"><div class="rail-header" data-act="rail" data-code="'+esc(r.code)+'"><div class="rail-code">'+esc(r.code)+'</div><div class="rail-text"><div class="rail-term">'+(r.ess?'<span class="rail-star">&#9733;</span>':'')+esc(r.term)+'</div><div class="rail-sub">'+esc(r.sub)+'</div>'+(r.tag?'<span class="eff-tag">'+esc(r.tag)+'</span>':'')+(r.ftag?'<span class="ftag">'+esc(r.ftag)+'</span>':'')+(r.ess?'<span class="ess-tag">Core rule &middot; '+esc(r.ess)+'</span>':'')+(r.prio?'<span class="exam-tag">&#9670; Practice priority</span>':'')+'</div><div class="rail-chev">&rsaquo;</div></div>'+body+'</div>';
}
function railsFilter(m,q){
 var rs=MD[m].rails.filter(function(r){return !q||railBlob(r).indexOf(q)>-1});
 return rs.length?rs.map(function(r){return railHTML(m,r)}).join(''):'<div class="no-match">No section in this module matches.</div>';
}
function sparHTML(m){
 var d=MD[m],on=!!S.sparOn,op=!!S.sparOpen[m];
 var h='<div class="spar-toggle" data-act="spar"><div><div class="spar-label">Sparring mode</div><div class="spar-state">'+(on?'ON &mdash; Sparring':'OFF &mdash; Classroom Mode')+'</div></div><div class="switch'+(on?' on':'')+'"><div class="knob"></div></div></div>';
 if(on){h+='<div class="spar"><div class="spar-h" data-act="sparbody"><span>Module sparring &middot; '+d.spar.length+' questions</span><span>'+(op?'Close':'Open')+'</span></div><div class="spar-b'+(op?' open':'')+'">'+d.spar.map(function(x,i){var k=m+'-'+i,rv=!!S.rev[k];return '<div class="q"><div class="q-l">QUESTION '+(i+1)+'</div><div class="q-t">'+x.q+'</div><textarea class="q-ta" data-k="'+k+'" placeholder="Reason it through first&hellip;">'+esc(S.ans[k]||'')+'</textarea><div class="reveal" data-act="reveal" data-k="'+k+'">'+(rv?'Hide model answer':'Reveal model answer')+'</div><div class="q-a'+(rv?' open':'')+'">'+x.a+'</div></div>'}).join('')+'</div></div>'}
 return h;
}
function gateState(n){
 var g=MD[n].gate,path=S.g[n]||[],id=g.start,end=null,done=[];
 for(var i=0;i<path.length;i++){var st=g.steps[id];if(!st)break;var a=path[i],nx=a=='y'?st.yes:st.no;done.push({id:id,a:a});if(typeof nx=='object'){end=nx;id=null;break}id=nx}
 return {done:done,cur:id,end:end};
}
function gateHTML(n){
 var g=MD[n].gate,s=gateState(n),h='<div class="gate"><div class="gate-h"><span>'+esc(g.title||'Decision gate')+'</span><span>Yes / No</span></div><div class="gate-b">';
 s.done.forEach(function(d,i){var st=g.steps[d.id];h+='<div class="gstep done"><div class="gnum">'+(i+1)+'</div><div class="gtxt"><div class="gq">'+esc(st.q)+'</div><span class="gans '+d.a+'">'+(d.a=='y'?'Yes':'No')+'</span><div class="glaw">'+esc(st.law)+'</div></div></div>'});
 if(s.end){h+='<div class="gout '+s.end.tone+'"><b>Outcome</b>'+esc(s.end.end)+'</div>'}
 else if(s.cur){var st2=g.steps[s.cur];h+='<div class="gstep active"><div class="gnum">'+(s.done.length+1)+'</div><div class="gtxt"><div class="gq">'+esc(st2.q)+'</div><div class="glaw">'+esc(st2.law)+'</div><div class="ghint">'+esc(st2.hint)+'</div><div class="gbtns"><div class="gbtn yes" data-act="gyes">Yes</div><div class="gbtn no" data-act="gno">No</div></div></div></div>'}
 h+='<div class="gnav">'+(s.done.length?'<span data-act="gback">&larr; Back</span><span data-act="grestart">Restart</span>':'')+'</div></div></div>';
 return h;
}
function finderHTML(n){
 var f=MD[n].finder;
 return '<div class="tool"><div class="tool-h">'+esc(f.h)+'</div><div class="tool-b">'+f.intro+'<input class="calc-in" id="finderQ" style="width:100%;margin-top:8px" placeholder="'+esc(f.ph)+'" value="'+esc(S.fq)+'" autocomplete="off"><div id="finderRes">'+finderRes(n)+'</div></div></div>';
}
function finderRes(n){
 var f=MD[n].finder,q=(S.fq||'').toLowerCase().trim(),ws=q?q.split(/\s+/):[];
 var res=f.items.filter(function(a){var b=(a.q+' '+a.f+' '+a.a+' '+a.n).toLowerCase();return ws.every(function(w){return b.indexOf(w)>-1})});
 return '<div class="fcount">'+res.length+' of '+f.items.length+' situations</div><div class="fres">'+res.map(function(a){return '<div class="fitem"'+(a.l?' data-act="open" data-n="'+a.l.m+'" data-sec="'+esc(a.l.sec)+'"':'')+'><span class="fp">'+esc(a.a)+'</span><b>'+esc(a.f)+'</b><div class="fd"><i>'+esc(a.q)+'</i><br>'+esc(a.n)+'</div></div>'}).join('')+'</div>';
}
function checkHTML(n){
 var c=MD[n].check,on=S.chk[n]||[];
 return '<div class="tool"><div class="tool-h">'+esc(c.h)+'</div><div class="tool-b">'+c.intro+'<div style="margin-top:8px">'+c.items.map(function(t,i){var k=on.indexOf(i)>-1;return '<div class="ck'+(k?' on':'')+'" data-act="ck" data-i="'+i+'"><div class="bx">'+(k?'&#10003;':'')+'</div><div class="t">'+t+'</div></div>'}).join('')+'</div><div class="ckmeta"><div>'+on.length+' of '+c.items.length+' ticked</div><span data-act="ckclear">Clear ticks</span></div></div></div>';
}
function legendHTML(n){
 var d=MD[n];if(!d.rails.some(function(r){return r.ess||r.prio}))return '';
 return '<div class="ess-legend">'+CFG.legend+'</div>';
}
function stripHTML(n){var s=MD[n].strip;if(!s)return '';return '<div class="strip">'+s.map(function(x,i){return (i?'<i>&rarr;</i>':'')+'<span>'+esc(x)+'</span>'}).join('')+'</div>'}
function renderMod(n){
 var m=mod(n),d=MD[n],a=arcOf(m);
 return '<div class="ms-header"><div class="ms-toprow"><div class="ms-home-btn" data-act="home">&#8962;</div><div class="ms-tag">'+esc(a.title.toUpperCase())+' &middot; '+esc(m.s)+'</div></div><div class="ms-title">'+m.n+'. '+esc(m.t)+'</div></div>'+
 '<div class="ms-intro">'+d.intro+'</div>'+stripHTML(n)+
 (d.gate?'<div id="gateHost">'+gateHTML(n)+'</div>':'')+
 (d.finder?finderHTML(n):'')+(d.check?'<div id="ckHost">'+checkHTML(n)+'</div>':'')+
 '<div class="defs-search-wrap"><input class="search" id="modSearch" placeholder="Search this module&hellip;" style="flex:1" autocomplete="off"><div class="defs-collapse-all" data-act="collapse">Collapse all</div></div><div id="rails">'+railsFilter(n,'')+'</div>'+
 (d.boundary?'<div class="boundary">'+d.boundary+'</div>':'')+(d.recall?'<div class="recall">'+d.recall+'</div>':'')+
 '<div id="sparHost">'+sparHTML(n)+'</div>'+navRow(n)+legendHTML(n)+fontBar();
}
function navRow(n){
 var i=MODS.findIndex(function(m){return m.n==n}),pv=MODS[i-1],nx=MODS[i+1];
 return '<div class="navrow">'+(pv?'<span class="xlink" data-act="open" data-n="'+pv.n+'">&larr; '+pv.n+'. '+esc(pv.t)+'</span>':'<span></span>')+(nx?'<span class="xlink" data-act="open" data-n="'+nx.n+'">'+nx.n+'. '+esc(nx.t)+' &rarr;</span>':'<span></span>')+'</div>';
}
function render(){
 var app=document.getElementById('app');
 app.innerHTML=S.view=='home'?renderHome():renderMod(S.mod);
 document.documentElement.style.fontSize=S.fs+'%';
}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;
 var a=t.getAttribute('data-act'),m=S.mod;
 if(a=='open'){S.view='mod';S.mod=+t.getAttribute('data-n');var sec=t.getAttribute('data-sec');if(sec){S.open[S.mod]=sec;save()}render();if(sec){var els=document.querySelectorAll('.rail'),el=null;for(var i=0;i<els.length;i++){if(els[i].getAttribute('data-code')==sec){el=els[i];break}}if(el)el.scrollIntoView({block:'start'});else window.scrollTo(0,0)}else window.scrollTo(0,0)}
 else if(a=='home'){S.view='home';render();window.scrollTo(0,0)}
 else if(a=='jump'){var el2=document.getElementById(t.getAttribute('data-id'));if(el2)el2.scrollIntoView({behavior:'smooth'})}
 else if(a=='rail'){var c=t.getAttribute('data-code');S.open[m]=S.open[m]==c?null:c;save();var q=(document.getElementById('modSearch')||{}).value||'';document.getElementById('rails').innerHTML=railsFilter(m,q.toLowerCase().trim());var rl=document.querySelectorAll('.rail');for(var j=0;j<rl.length;j++){if(rl[j].getAttribute('data-code')==c&&S.open[m]==c){rl[j].scrollIntoView({behavior:'smooth',block:'nearest'})}}}
 else if(a=='collapse'){S.open[m]=null;save();var q2=(document.getElementById('modSearch')||{}).value||'';document.getElementById('rails').innerHTML=railsFilter(m,q2.toLowerCase().trim())}
 else if(a=='spar'){S.sparOn=!S.sparOn;save();if(S.view=='home')document.getElementById('sparHome').innerHTML=sparToggle();else document.getElementById('sparHost').innerHTML=sparHTML(m)}
 else if(a=='sparbody'){S.sparOpen[m]=!S.sparOpen[m];save();document.getElementById('sparHost').innerHTML=sparHTML(m)}
 else if(a=='reveal'){var k=t.getAttribute('data-k');S.rev[k]=!S.rev[k];save();document.getElementById('sparHost').innerHTML=sparHTML(m)}
 else if(a=='gyes'||a=='gno'){(S.g[m]=S.g[m]||[]).push(a=='gyes'?'y':'n');save();document.getElementById('gateHost').innerHTML=gateHTML(m)}
 else if(a=='gback'){(S.g[m]||[]).pop();save();document.getElementById('gateHost').innerHTML=gateHTML(m)}
 else if(a=='grestart'){S.g[m]=[];save();document.getElementById('gateHost').innerHTML=gateHTML(m)}
 else if(a=='ck'){var i2=+t.getAttribute('data-i'),L=S.chk[m]=S.chk[m]||[],p=L.indexOf(i2);if(p>-1)L.splice(p,1);else L.push(i2);save();document.getElementById('ckHost').innerHTML=checkHTML(m)}
 else if(a=='ckclear'){S.chk[m]=[];save();document.getElementById('ckHost').innerHTML=checkHTML(m)}
 else if(a=='fs'){S.fs=Math.max(80,Math.min(140,S.fs+10*(+t.getAttribute('data-d'))));save();document.documentElement.style.fontSize=S.fs+'%';document.querySelectorAll('.font-size-display').forEach(function(x){x.textContent=S.fs+'%'})}
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id=='homeSearch'){document.getElementById('homeList').innerHTML=homeList(t.value.toLowerCase().trim())}
 else if(t.id=='modSearch'){document.getElementById('rails').innerHTML=railsFilter(S.mod,t.value.toLowerCase().trim())}
 else if(t.id=='finderQ'){S.fq=t.value;document.getElementById('finderRes').innerHTML=finderRes(S.mod)}
 else if(t.classList&&t.classList.contains('q-ta')){S.ans[t.getAttribute('data-k')]=t.value;save()}
});
load();S.fs=Math.max(80,Math.min(140,+S.fs||120));render();
</script>
</body>
</html>
